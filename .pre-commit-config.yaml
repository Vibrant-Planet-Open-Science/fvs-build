repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The patches' context lines carry upstream's trailing whitespace, and
      # `git apply` needs them byte-exact: "cleaning" one breaks the GUI build.
      - id: trailing-whitespace
        exclude: ^docker/fvs-workspace/patches/
      - id: end-of-file-fixer
        exclude: ^docker/fvs-workspace/patches/
      - id: check-yaml
        # Actions YAML may use tags PyYAML rejects without --unsafe;
        # actionlint does the workflow-aware validation.
        args: ["--unsafe"]
      - id: check-merge-conflict
      - id: check-added-large-files

  # The docker hook bundles shellcheck, so local runs and CI use the same
  # version (the Go hook uses whatever shellcheck is on PATH).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^tools/ci/.*\.sh$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # GitHub input defaults must be literals, so the default FVS and Interface
  # refs are copied across workflows and docs; this fails unless each agrees.
  - repo: local
    hooks:
      - id: check-default-refs
        name: check default refs agree
        entry: python3 tools/ci/check_default_refs.py
        language: system
        pass_filenames: false
      # spdx-tools lives only in this hook's environment; the build job that
      # writes the SBOM stays stdlib-only.
      - id: test-provenance
        name: test provenance SBOM and config
        entry: python tools/ci/test_provenance.py
        language: python
        additional_dependencies: ["spdx-tools==0.8.5"]
        files: ^tools/ci/(provenance|test_provenance)\.py$
        pass_filenames: false

  # The docker hook needs only Docker, not a local hadolint binary.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        files: ^docker/Dockerfile
