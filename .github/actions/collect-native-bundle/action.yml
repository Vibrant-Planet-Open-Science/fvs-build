name: Collect native FVS bundle
description: >
  Download the build job's staging artifact, run collect-bundle, SPDX scan with syft,
  upload the bundle. The calling job must run actions/checkout on the workflow
  repository first so uses: ./.github/actions/collect-native-bundle resolves.

inputs:
  fvs_native_platform:
    description: >
      Value for FVS_NATIVE_PLATFORM passed to provenance.py (linux, windows, or
      darwin). Must match the staging layout and SBOM paths used by the build job.
    required: true
  staging_artifact:
    description: >
      Name of the build job's staging artifact (e.g. linux-x86_64-staging,
      windows-staging); it holds staging/<os>-variant-<v>/ directories.
    required: true
  artifact_name:
    description: >
      Bundle directory name and upload-artifact name (callers typically pass
      fvs-native-linux-<arch>-<run_id> using github.run_id in the workflow YAML).
    required: true
  variants_input:
    description: Comma-separated variant list (same as workflow inputs.variants).
    required: true
  runner_image:
    description: Runner image label recorded in provenance.
    required: true
  meson_version:
    description: Pinned Meson version string for provenance.
    required: true
  use_setup_python:
    description: >
      If the string "true", run actions/setup-python before collect (Windows/macOS).
    required: false
    default: "false"
  python_cmd:
    description: Python executable for provenance.py (e.g. python3 or python).
    required: false
    default: python3
  python_version:
    description: Version for setup-python when use_setup_python is true.
    required: false
    default: "3.12"

outputs:
  artifact_name:
    description: Bundle artifact name (directory and upload name).
    value: ${{ steps.bundle.outputs.artifact_name }}

runs:
  using: composite
  steps:
    - name: Resolve fvs-build repo, ref and commit
      id: fb_ref
      uses: ./.github/actions/resolve-fvs-build-ref

    - name: Check out fvs-build (CI scripts)
      uses: actions/checkout@v7
      with:
        repository: ${{ steps.fb_ref.outputs.repo }}
        ref: ${{ steps.fb_ref.outputs.sha }}
        path: fvs-build
        fetch-depth: 1

    - uses: actions/setup-python@v7
      if: ${{ inputs.use_setup_python == 'true' }}
      with:
        python-version: ${{ inputs.python_version }}

    - name: Download staging artifact
      uses: actions/download-artifact@v8
      with:
        path: staging
        name: ${{ inputs.staging_artifact }}

    - name: Fan into canonical bundle layout
      id: bundle
      shell: bash
      env:
        FVS_NATIVE_PLATFORM: ${{ inputs.fvs_native_platform }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        VARIANTS_INPUT: ${{ inputs.variants_input }}
        RUNNER_IMAGE: ${{ inputs.runner_image }}
        MESON_PIN: ${{ inputs.meson_version }}
      run: |
        set -euo pipefail
        ${{ inputs.python_cmd }} fvs-build/tools/ci/provenance.py collect-bundle
        echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

    - name: Install syft (for SBOM generation)
      uses: anchore/sbom-action/download-syft@v0

    - name: Generate SPDX SBOM of bundled binaries
      shell: bash
      env:
        FVS_NATIVE_PLATFORM: ${{ inputs.fvs_native_platform }}
        BUNDLE: ${{ steps.bundle.outputs.artifact_name }}
      run: |
        set -euo pipefail
        syft scan "dir:${BUNDLE}" -o spdx-json \
          | ${{ inputs.python_cmd }} fvs-build/tools/ci/provenance.py complete-sbom --root "${BUNDLE}"

    - name: Upload bundled artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.bundle.outputs.artifact_name }}
        path: ${{ steps.bundle.outputs.artifact_name }}/
        retention-days: 30
        if-no-files-found: error
