# Reusable workflow: Binder-ready FVS workspace image from build-native-linux.yml
# bundles. Interface: docs/workflow-interface.md; notes: docs/fvs-workspace-container.md.

name: Build Linux FVS workspace container image (reusable)

on:
  workflow_call:
    inputs:
      arm64:
        description: >-
          Build linux/arm64 as well as linux/amd64, so the tags point at a
          two-arch manifest list. Each arch needs a build-native-linux.yml job
          earlier in the same run (arch x86_64, and aarch64 when this is true);
          its bundle `fvs-native-linux-<arch>-<run_id>` is downloaded by name.
        required: false
        type: boolean
        default: true
      interface_repo:
        description: >-
          Source repo (owner/name) providing the rFVS + fvsOL R packages.
          Defaults to the upstream USFS Interface repository.
        required: false
        type: string
        default: "USDAForestService/ForestVegetationSimulator-Interface"
      interface_ref:
        description: >-
          Tag, branch, or SHA in interface_repo for the rFVS/fvsOL sources.
          Must be release 20261019 or later: earlier refs ship rFVS/fvsOL
          without NAMESPACE and fail Dockerfile.fvs-workspace's guard.
        required: false
        type: string
        default: "20261109"
      image_name:
        description: >-
          Fully-qualified image name without the tag suffix, e.g.
          `ghcr.io/vibrant-planet-open-science/fvs-workspace`.
        required: true
        type: string
      image_tag:
        description: >-
          Primary tag for the built image, e.g. `2027.1.0`.
        required: true
        type: string
      image_extra_tags:
        description: >-
          Comma-separated additional tags applied at push time (e.g. `latest`).
          Each points at the same manifest list as the primary tag.
        required: false
        type: string
        default: ""
      push:
        description: >-
          Push the built image to the registry after the build succeeds.
          Defaults to false so dispatch / dry-run callers do not accidentally
          publish; production callers must explicitly set true. NOTE: for
          mybinder.org to pull the image it must be pushed AND made public.
        required: false
        type: boolean
        default: false
    outputs:
      image_ref:
        description: "Primary image reference: <image_name>:<image_tag>."
        value: ${{ jobs.build.outputs.image_ref }}
      image_digest:
        description: >-
          Digest of the manifest list behind the tags, in `sha256:...` form.
          Empty unless `push: true`.
        value: ${{ jobs.manifest.outputs.image_digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }} and (optionally) push by digest
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ !inputs.arm64 && 'arm64' || 'none' }}
    outputs:
      image_ref: ${{ steps.refs.outputs.image_ref }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      # In a called workflow github.* and a bare checkout are the caller's repo;
      # job.workflow_* is this repo, which tools/ needs.
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1

      - name: Download fvs-native-linux artifact bundle
        uses: actions/download-artifact@v8
        with:
          name: fvs-native-linux-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-${{ github.run_id }}
          path: bundle

      - name: Verify bundle provides the FVS<v>.so set
        run: |
          set -euo pipefail
          for required in \
            bundle/provenance/manifest.json \
            bundle/sbom/fvs-native.spdx.json
          do
            if [ ! -f "$required" ]; then
              echo "ERROR: bundle missing required file: ${required}" >&2
              exit 1
            fi
          done
          shopt -s nullglob
          libs=(bundle/FVS*.so)
          shopt -u nullglob
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "ERROR: no bundle/FVS*.so at bundle root (the GUI drives FVS" >&2
            echo "       via dyn.load of the .so set)" >&2
            exit 1
          fi
          echo "Bundle shared libraries:"
          printf '%s\n' "${libs[@]}"

      - name: Check out ForestVegetationSimulator-Interface source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.interface_repo }}
          ref: ${{ inputs.interface_ref }}
          path: interface
          fetch-depth: 1

      - name: Stage rFVS + fvsOL package sources
        id: interface
        run: |
          set -euo pipefail
          INTERFACE_SHA=$(git -C interface rev-parse HEAD)
          echo "INTERFACE_SHA=${INTERFACE_SHA}" >> "$GITHUB_ENV"

          stage() {
            local pkg="$1" desc dir
            # Package root: the directory whose DESCRIPTION declares `Package: <pkg>`.
            desc=$(grep -rl --include=DESCRIPTION \
              -E "^Package:[[:space:]]*${pkg}([[:space:]]|\$)" interface \
              | head -n 1 || true)
            if [ -z "${desc}" ]; then
              echo "ERROR: could not find R package '${pkg}' under interface/" >&2
              echo "       (no DESCRIPTION with 'Package: ${pkg}')" >&2
              exit 1
            fi
            dir=$(dirname "${desc}")
            echo "Staging ${pkg} from ${dir}"
            rm -rf "fvs-workspace-context/${pkg}"
            mkdir -p fvs-workspace-context
            cp -a "${dir}" "fvs-workspace-context/${pkg}"
          }

          stage rFVS
          stage fvsOL
          echo "Staged package contexts:"
          ls -la fvs-workspace-context

      - name: Extract provenance from bundle manifest
        id: provenance
        run: |
          set -euo pipefail
          python3 tools/ci/provenance.py manifest-to-github-env

      # Catches an aarch64 bundle passed as artifact_name (or the reverse),
      # which would otherwise be published under the wrong platform.
      - name: Verify bundle arch matches this leg
        run: |
          case "${BUNDLE_ARCH}:${ARCH}" in
            x86_64:amd64|aarch64:arm64) echo "bundle arch ${BUNDLE_ARCH} matches linux/${ARCH}" ;;
            *) echo "ERROR: bundle is ${BUNDLE_ARCH}, but this is the linux/${ARCH} leg" >&2; exit 1 ;;
          esac

      - name: Compose image references
        id: refs
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image_ref=${IMAGE_REF}"      >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=${IMAGE_REF}"      >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --load for the smoke test and SBOM scan; the push step reruns the saved
      # arguments from the builder cache, so a failed build never publishes.
      # The gha layer cache is for pull requests only: a dispatch on main may
      # build an arbitrary interface_repo, whose layers must never reach a
      # release build. Releases build clean.
      - name: Build FVS workspace image (load locally)
        env:
          INTERFACE_REPO: ${{ inputs.interface_repo }}
          INTERFACE_REF: ${{ inputs.interface_ref }}
        run: |
          set -euo pipefail
          cache=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cache=(--cache-from "type=gha,scope=fvs-workspace-${ARCH}"
              --cache-to "type=gha,mode=max,scope=fvs-workspace-${ARCH},ignore-error=true")
          fi
          args=(
            --platform "linux/${ARCH}"
            --build-arg SOURCE_REPO="${SOURCE_REPO}"
            --build-arg SOURCE_REF="${SOURCE_REF}"
            --build-arg SOURCE_SHA="${SOURCE_SHA}"
            --build-arg FVS_BUILD_REPO="${FVS_BUILD_REPO}"
            --build-arg FVS_BUILD_REF="${FVS_BUILD_REF}"
            --build-arg FVS_BUILD_SHA="${FVS_BUILD_SHA}"
            --build-arg VARIANTS="${VARIANTS_BUILT}"
            --build-arg GFORTRAN_VERSION="${GFORTRAN_VERSION}"
            --build-arg MESON_VERSION="${MESON_VERSION}"
            --build-arg TIMESTAMP="${TIMESTAMP}"
            --build-arg INTERFACE_REPO="${INTERFACE_REPO}"
            --build-arg INTERFACE_REF="${INTERFACE_REF}"
            --build-arg INTERFACE_SHA="${INTERFACE_SHA}"
            -f docker/Dockerfile.fvs-workspace
            .
          )
          printf '%s\n' "${args[@]}" > "${RUNNER_TEMP}/buildx-args"
          docker buildx build --load --tag "${IMAGE_REF}" "${cache[@]}" "${args[@]}"

      - name: Smoke-test the built image
        run: bash tools/ci/smoke_fvs_workspace.sh "${IMAGE_REF}"

      - name: Log in to GHCR
        if: inputs.push && startsWith(inputs.image_name, 'ghcr.io/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push untagged, by digest; the manifest job applies the tags. Matrix
      # legs cannot hand per-leg outputs to a later job, so the digest
      # travels as a small artifact.
      - name: Push image by digest
        if: inputs.push
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          mapfile -t args < "${RUNNER_TEMP}/buildx-args"
          docker buildx build "${args[@]}" \
            --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${RUNNER_TEMP}/metadata.json"
          mkdir -p "${RUNNER_TEMP}/digests"
          jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json" > "${RUNNER_TEMP}/digests/${ARCH}"
          echo "Pushed ${IMAGE_NAME}@$(cat "${RUNNER_TEMP}/digests/${ARCH}") (${ARCH})"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: container-fvs-workspace-digest-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

      - name: Install syft (for image SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SPDX SBOM of built image
        run: |
          set -euo pipefail
          syft scan "${IMAGE_REF}" \
            -o "spdx-json=container-fvs-workspace-sbom.spdx.json"
          echo "Image SBOM size: $(wc -c < container-fvs-workspace-sbom.spdx.json) bytes"

      - name: Upload image SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: container-fvs-workspace-sbom-${{ matrix.arch }}-${{ github.run_id }}
          path: container-fvs-workspace-sbom.spdx.json
          retention-days: 30
          if-no-files-found: error

  # An amd64-only call still produces a (one-entry) manifest list.
  manifest:
    name: Create multi-arch manifest list
    needs: build
    if: inputs.push
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.create.outputs.image_digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: container-fvs-workspace-digest-*-${{ github.run_id }}
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        if: startsWith(inputs.image_name, 'ghcr.io/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest list
        id: create
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_EXTRA_TAGS: ${{ inputs.image_extra_tags }}
        run: |
          set -euo pipefail
          tags=(--tag "${IMAGE_REF}")
          IFS=',' read -ra EXTRA <<< "${IMAGE_EXTRA_TAGS}"
          for T in "${EXTRA[@]}"; do
            T_TRIM=$(echo "$T" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
            if [ -n "$T_TRIM" ]; then tags+=(--tag "${IMAGE_NAME}:${T_TRIM}"); fi
          done
          sources=()
          for f in digests/*; do
            sources+=("${IMAGE_NAME}@$(cat "$f")")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_REF}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_REF}" --format '{{.Manifest.Digest}}')
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_REF} (manifest list digest: ${DIGEST})"
