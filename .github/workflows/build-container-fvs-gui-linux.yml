# Reusable workflow: build the FVSOnLocal (fvsOL) GUI container image from a
# fvs-native-linux artifact bundle + the ForestVegetationSimulator-Interface
# source, and (optionally) push to GHCR.
#
# Like build-container-linux.yml, FVS is NOT compiled here: the FVS<v>.so
# embedder libraries come from a prior build-native-linux.yml bundle (reused,
# not rebuilt -- ADR-001 preserved). What IS built in Docker is the pure-R glue
# layer (rFVS + fvsOL); see docs/adr-002. The result is a Binder-ready image
# (rocker/r2u:noble + Jupyter + jupyter-server-proxy) that serves the Shiny app
# at the /fvs-gui/ subpath.
#
# Caller pattern (orchestrator, see dispatch-container-fvs-gui-linux.yml):
#
#   jobs:
#     native:
#       uses: <owner>/fvs-build/.github/workflows/build-native-linux.yml@<ref>
#       with: { source_repo: ..., source_ref: ... }
#     fvs-gui-container:
#       needs: native
#       uses: <owner>/fvs-build/.github/workflows/build-container-fvs-gui-linux.yml@<ref>
#       with:
#         artifact_name: ${{ needs.native.outputs.artifact_name }}
#         interface_ref: 92dc046adc1d16ddd320b79e9239abd832cbb069
#         image_name: ghcr.io/<owner>/usfs-fvs-gui
#         image_tag: FS2026.2
#         push: true
#       secrets: inherit
#       permissions: { contents: read, packages: write }

name: Build Linux FVS GUI container image (reusable)

on:
  workflow_call:
    inputs:
      artifact_name:
        description: >-
          Name of the fvs-native-linux artifact bundle produced by a prior
          build-native-linux.yml job in the same workflow run (typically
          `fvs-native-linux-<run_id>`). Only its FVS<v>.so set is used.
        required: true
        type: string
      interface_repo:
        description: >-
          Source repo (owner/name) providing the rFVS + fvsOL R packages.
          Defaults to the upstream USFS Interface repository.
        required: false
        type: string
        default: "USDAForestService/ForestVegetationSimulator-Interface"
      interface_ref:
        description: >-
          Tag, branch, or SHA in interface_repo for the rFVS/fvsOL sources.
          The default pins upstream main at the commit carrying the RSQLite
          >= 3.53.1 temp-table fix. Refs predating that fix (including the
          FS2026.2 release tag) fail Dockerfile.fvs-gui's guard, because the
          GUI greys out on stand selection without it.
        required: false
        type: string
        default: "92dc046adc1d16ddd320b79e9239abd832cbb069"
      image_name:
        description: >-
          Fully-qualified image name without the tag suffix, e.g.
          `ghcr.io/vibrant-planet-open-science/usfs-fvs-gui`.
        required: true
        type: string
      image_tag:
        description: >-
          Primary tag for the built image, e.g. `FS2026.2`.
        required: true
        type: string
      image_extra_tags:
        description: >-
          Comma-separated additional tags applied at push time (e.g. `latest`).
          Each is `docker tag`ged from the primary and pushed alongside it.
        required: false
        type: string
        default: ""
      runner_image:
        description: >-
          GitHub-hosted runner image label this workflow runs on.
        required: false
        type: string
        default: "ubuntu-24.04"
      push:
        description: >-
          Push the built image to the registry after the build succeeds.
          Defaults to false so dispatch / dry-run callers do not accidentally
          publish; production callers must explicitly set true. NOTE: for
          mybinder.org to pull the image it must be pushed AND made public.
        required: false
        type: boolean
        default: false
    outputs:
      image_ref:
        description: "Primary image reference: <image_name>:<image_tag>."
        value: ${{ jobs.build.outputs.image_ref }}
      image_digest:
        description: >-
          Image digest in `sha256:...` form. Empty unless `push: true`.
        value: ${{ jobs.build.outputs.image_digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and (optionally) push
    runs-on: ${{ inputs.runner_image }}
    outputs:
      image_ref: ${{ steps.refs.outputs.image_ref }}
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      # Reusable-workflow jobs need the workflow repo on disk before uses: ./...
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve fvs-build repo and ref from workflow_ref
        id: fb_ref
        uses: ./.github/actions/resolve-fvs-build-ref

      - name: Check out fvs-build (Dockerfile.fvs-gui + baked files)
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.fb_ref.outputs.repo }}
          ref: ${{ steps.fb_ref.outputs.ref }}

      - name: Download fvs-native-linux artifact bundle
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: bundle

      - name: Verify bundle provides the FVS<v>.so set
        run: |
          set -euo pipefail
          for required in \
            bundle/provenance/manifest.json \
            bundle/sbom/fvs-native-linux.spdx.json
          do
            if [ ! -f "$required" ]; then
              echo "ERROR: bundle missing required file: ${required}" >&2
              echo "       (see docs/workflow-interface.md for the contract)" >&2
              exit 1
            fi
          done
          shopt -s nullglob
          libs=(bundle/FVS*.so)
          shopt -u nullglob
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "ERROR: no bundle/FVS*.so at bundle root (the GUI drives FVS" >&2
            echo "       via dyn.load of the .so set)" >&2
            exit 1
          fi
          echo "Bundle shared libraries:"
          printf '%s\n' "${libs[@]}"

      # rFVS + fvsOL sources. Checked out into interface/, then staged as
      # siblings under fvs-gui-context/ so Dockerfile.fvs-gui has stable COPY
      # paths regardless of where the packages live inside the Interface repo.
      - name: Check out ForestVegetationSimulator-Interface source
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.interface_repo }}
          ref: ${{ inputs.interface_ref }}
          path: interface
          fetch-depth: 1

      - name: Stage rFVS + fvsOL package sources
        id: interface
        run: |
          set -euo pipefail
          INTERFACE_SHA=$(git -C interface rev-parse HEAD)
          echo "INTERFACE_SHA=${INTERFACE_SHA}" >> "$GITHUB_ENV"

          stage() {
            local pkg="$1" desc dir
            # Locate the package root: the directory whose DESCRIPTION declares
            # `Package: <pkg>`. --include restricts the recursive grep to files
            # literally named DESCRIPTION.
            desc=$(grep -rl --include=DESCRIPTION \
              -E "^Package:[[:space:]]*${pkg}([[:space:]]|\$)" interface \
              | head -n 1 || true)
            if [ -z "${desc}" ]; then
              echo "ERROR: could not find R package '${pkg}' under interface/" >&2
              echo "       (no DESCRIPTION with 'Package: ${pkg}')" >&2
              exit 1
            fi
            dir=$(dirname "${desc}")
            echo "Staging ${pkg} from ${dir}"
            rm -rf "fvs-gui-context/${pkg}"
            mkdir -p fvs-gui-context
            cp -a "${dir}" "fvs-gui-context/${pkg}"
          }

          stage rFVS
          stage fvsOL
          echo "Staged package contexts:"
          ls -la fvs-gui-context

      - name: Extract provenance from bundle manifest
        id: provenance
        run: |
          set -euo pipefail
          python3 tools/ci/provenance.py manifest-to-github-env

      - name: Compose image references
        id: refs
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image_ref=${IMAGE_REF}"      >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=${IMAGE_REF}"      >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --load leaves the image in the local daemon for push / inspection.
      # Push runs in a later, guarded step so a failed build never publishes.
      - name: Build FVS GUI image (load locally)
        env:
          INTERFACE_REPO: ${{ inputs.interface_repo }}
          INTERFACE_REF: ${{ inputs.interface_ref }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --cache-from type=gha,scope=fvs-gui \
            --cache-to type=gha,mode=max,scope=fvs-gui,ignore-error=true \
            --tag "${IMAGE_REF}" \
            --build-arg SOURCE_REPO="${SOURCE_REPO}" \
            --build-arg SOURCE_REF="${SOURCE_REF}" \
            --build-arg SOURCE_SHA="${SOURCE_SHA}" \
            --build-arg FVS_BUILD_REPO="${FVS_BUILD_REPO}" \
            --build-arg FVS_BUILD_REF="${FVS_BUILD_REF}" \
            --build-arg FVS_BUILD_SHA="${FVS_BUILD_SHA}" \
            --build-arg VARIANTS="${VARIANTS_BUILT}" \
            --build-arg GFORTRAN_VERSION="${GFORTRAN_VERSION}" \
            --build-arg MESON_VERSION="${MESON_VERSION}" \
            --build-arg TIMESTAMP="${TIMESTAMP}" \
            --build-arg INTERFACE_REPO="${INTERFACE_REPO}" \
            --build-arg INTERFACE_REF="${INTERFACE_REF}" \
            --build-arg INTERFACE_SHA="${INTERFACE_SHA}" \
            -f docker/Dockerfile.fvs-gui \
            .

      - name: Smoke-test the built image
        run: bash tools/ci/smoke_fvs_gui.sh "${IMAGE_REF}"

      - name: Log in to GHCR
        if: inputs.push && startsWith(inputs.image_name, 'ghcr.io/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        id: push
        if: inputs.push
        env:
          IMAGE_EXTRA_TAGS: ${{ inputs.image_extra_tags }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_REF}"
          if [ -n "${IMAGE_EXTRA_TAGS}" ]; then
            IFS=',' read -ra TAGS <<< "${IMAGE_EXTRA_TAGS}"
            for T in "${TAGS[@]}"; do
              T_TRIM=$(echo "$T" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
              [ -z "$T_TRIM" ] && continue
              EXTRA_REF="${IMAGE_NAME}:${T_TRIM}"
              docker tag  "${IMAGE_REF}" "${EXTRA_REF}"
              docker push "${EXTRA_REF}"
              echo "pushed extra tag: ${EXTRA_REF}"
            done
          fi
          DIGEST=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE_REF}" \
            | grep -F "${IMAGE_NAME}@" \
            | head -n 1 \
            | awk -F '@' '{print $2}' || true)
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_REF} (digest: ${DIGEST:-unknown})"

      - name: Install syft (for image SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SPDX SBOM of built image
        run: |
          set -euo pipefail
          syft scan "${IMAGE_REF}" \
            -o "spdx-json=container-fvs-gui-sbom.spdx.json"
          echo "Image SBOM size: $(wc -c < container-fvs-gui-sbom.spdx.json) bytes"

      - name: Upload image SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: container-fvs-gui-sbom-${{ github.run_id }}
          path: container-fvs-gui-sbom.spdx.json
          retention-days: 30
          if-no-files-found: error
