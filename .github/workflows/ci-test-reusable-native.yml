# No `paths:` filter: a skipped run leaves a required check pending forever, so
# the `changes` job gates the builds instead. Make `native-builds` the required
# check; the reusable-workflow job names are not stable check names.

name: Test reusable native workflows (pull request)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect native build changes
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff monitored paths against PR base
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Anything that can change native build output.
          changed=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- \
            .github/actions/prepare-fvs-native-checkout/action.yml \
            .github/actions/resolve-fvs-build-ref/action.yml \
            .github/workflows/build-native-linux.yml \
            .github/workflows/build-native-windows.yml \
            .github/workflows/build-native-macos.yml \
            .github/workflows/ci-test-reusable-native.yml \
            meson.build \
            meson_options.txt \
            tools/ci/provenance.py \
            tools/ci/resolve_variants.sh \
            tools/ci/smoke_test_native.sh \
            tools/ci/meson_configure_native.sh \
            tools/ci/check_gcc_major.sh \
            tools/ci/msys2-toolchains.json \
            tools/parse_sourcelist.py)

          if [ -n "$changed" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Native build matrix: running"
              echo
              echo "Changed monitored paths:"
              echo '```'
              echo "$changed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "### Native build matrix: skipped (no monitored paths changed)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  linux:
    name: Linux (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      variants: ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws
      runner_image: ubuntu-24.04
      gcc_major: "14"
      meson_version: "1.12.0"
      profile: reference

  linux-arm64:
    name: Linux arm64 (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      variants: ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws
      runner_image: ubuntu-24.04-arm
      gcc_major: "14"
      meson_version: "1.12.0"
      profile: reference

  windows:
    name: Windows (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native-windows.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      variants: ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws
      runner_image: windows-latest
      gcc_major: "15"
      meson_version: "1.12.0"
      profile: reference

  macos:
    name: macOS (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native-macos.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      variants: ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws
      runner_image: macos-15
      gcc_major: "15"
      meson_version: "1.12.0"
      profile: reference

  native-builds:
    name: Native builds
    if: always()
    needs:
      - changes
      - linux
      - linux-arm64
      - windows
      - macos
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate matrix result
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          LINUX: ${{ needs.linux.result }}
          LINUX_ARM64: ${{ needs.linux-arm64.result }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES" != "success" ]; then
            echo "Change detection did not succeed (result: $CHANGES)."
            exit 1
          fi

          if [ "$NATIVE" != "true" ]; then
            echo "No monitored native build paths changed; nothing to build."
            exit 0
          fi

          status=0
          for pair in "Linux:$LINUX" "Linux arm64:$LINUX_ARM64" "Windows:$WINDOWS" "macOS:$MACOS"; do
            name=${pair%%:*}
            result=${pair#*:}
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              status=1
            fi
          done
          exit "$status"
