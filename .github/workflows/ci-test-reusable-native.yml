# No `paths:` filter: a skipped run leaves a required check pending forever, so
# the `changes` job gates the jobs instead. `Native builds` is the required
# check; the reusable-workflow job names are not stable check names.

name: Test native builds and GUI image (pull request)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# packages: write is never used (push: false), but the GUI workflow declares it
# and cannot get more than its caller grants: without it, startup_failure.
permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.filter.outputs.native }}
      gui: ${{ steps.filter.outputs.gui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # native: anything that can change native build output, so all four
      # builds run. gui: the GUI image's own files; it is built from the Linux
      # bundles, so a native change runs it too.
      - name: Diff paths against PR base
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed() { git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- "$@"; }
          native=$(changed .github/actions '.github/workflows/build-native-*' \
            .github/workflows/ci-test-reusable-native.yml meson.build meson_options.txt \
            tools ':!tools/ci/smoke_fvs_gui.sh')
          gui=$(changed docker/Dockerfile.fvs-gui docker/fvs-gui \
            .github/workflows/build-container-fvs-gui-linux.yml tools/ci/smoke_fvs_gui.sh)
          [ -n "$native" ] && n=true || n=false
          [ -n "$native$gui" ] && g=true || g=false
          { echo "native=$n"; echo "gui=$g"; } >> "$GITHUB_OUTPUT"
          {
            echo "native builds: $n, GUI image: $g"
            echo '```'
            printf '%s\n' "$native" "$gui" | sed '/^$/d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.gui == 'true'
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      variants: ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws
      runner_image: ubuntu-24.04
      gcc_major: "14"
      meson_version: "1.12.0"
      profile: reference

  linux-arm64:
    name: Linux arm64 (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.gui == 'true'
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      variants: ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws
      runner_image: ubuntu-24.04-arm
      gcc_major: "14"
      meson_version: "1.12.0"
      profile: reference

  windows:
    name: Windows (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native-windows.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      variants: ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws
      runner_image: windows-latest
      gcc_major: "15"
      meson_version: "1.12.0"
      profile: reference

  macos:
    name: macOS (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native-macos.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      variants: ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws
      runner_image: macos-15
      gcc_major: "15"
      meson_version: "1.12.0"
      profile: reference

  fvs-gui:
    name: FVS GUI image (reusable)
    needs: [changes, linux, linux-arm64]
    if: needs.changes.outputs.gui == 'true'
    uses: ./.github/workflows/build-container-fvs-gui-linux.yml
    with:
      artifact_name: ${{ needs.linux.outputs.artifact_name }}
      artifact_name_arm64: ${{ needs.linux-arm64.outputs.artifact_name }}
      interface_ref: "20261109"
      image_name: usfs-fvs-gui
      image_tag: ci-${{ github.run_id }}
      push: false

  # Jobs skipped by `changes` are fine; a failed or cancelled one is not. A job
  # skipped because a dependency failed is covered by that dependency's failure.
  native-builds:
    name: Native builds
    if: always()
    needs: [changes, linux, linux-arm64, windows, macos, fvs-gui]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
