# No `paths:` filter: a skipped run leaves a required check pending forever, so
# the `changes` job gates the jobs instead. `Native builds` is the required
# check; the reusable-workflow job names are not stable check names.

name: Test native builds and workspace image (pull request)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# packages: write is never used here (push: false), but
# build-container-fvs-workspace.yml declares it, and a called workflow can't get
# more than its caller grants: without it, the run fails with startup_failure.
permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.filter.outputs.native }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # native: anything that can change native build output, so all four
      # builds run. image: the workspace image's own files; it is built
      # from the Linux bundles, so a native change runs it too.
      - name: Diff paths against PR base
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed() { git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- "$@"; }
          native=$(changed '.github/workflows/build-native-*' \
            .github/workflows/ci-test-reusable-native.yml meson.build meson_options.txt \
            tools ':!tools/ci/smoke_fvs_workspace.sh')
          image=$(changed docker/Dockerfile.fvs-workspace docker/fvs-workspace \
            .github/workflows/build-container-fvs-workspace.yml tools/ci/smoke_fvs_workspace.sh)
          [ -n "$native" ] && n=true || n=false
          [ -n "$native$image" ] && i=true || i=false
          { echo "native=$n"; echo "image=$i"; } >> "$GITHUB_OUTPUT"
          {
            echo "native builds: $n, workspace image: $i"
            echo '```'
            printf '%s\n' "$native" "$image" | sed '/^$/d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0

  linux-arm64:
    name: Linux arm64 (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      arch: aarch64

  windows:
    name: Windows (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native-windows.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0

  macos:
    name: macOS (reusable)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native-macos.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0

  fvs-workspace:
    name: FVS workspace image (reusable)
    needs: [changes, linux, linux-arm64]
    if: needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/build-container-fvs-workspace.yml
    with:
      interface_ref: "20261109"
      image_name: fvs-workspace
      image_tag: ci-${{ github.run_id }}
      push: false

  # Jobs skipped by `changes` are fine; a failed or cancelled one is not. A job
  # skipped because a dependency failed is covered by that dependency's failure.
  native-builds:
    name: Native builds
    if: always()
    needs: [changes, linux, linux-arm64, windows, macos, fvs-workspace]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
