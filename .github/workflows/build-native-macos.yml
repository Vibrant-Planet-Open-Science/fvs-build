# Reusable workflow: build native macOS FVS artifacts (Homebrew GCC / gfortran)
# via the fvs-build Meson overlay.
#
# Same structure as build-native-linux.yml / build-native-windows.yml; bundle
# uses extensionless executables and `FVS<v>.so` embedder libraries.

name: Build native macOS FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Defaults to the 22 US
          variants that build cleanly on Linux; macOS may differ slightly.
        required: false
        type: string
        default: "ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws"
      runner_image:
        description: >-
          GitHub-hosted macOS runner label.
        required: false
        type: string
        default: "macos-15"
      gcc_major:
        description: >-
          GCC major version. Installs Homebrew `gcc@N`, or the unversioned
          `gcc` formula when N is its current major, and sets
          FC=gfortran-N, CC=gcc-N, CXX=g++-N. Recorded in provenance as the
          formula name for both Fortran and C++ labels.
        required: false
        type: string
        default: "15"
      meson_version:
        description: >-
          Exact Meson version installed via pip.
        required: false
        type: string
        default: "1.12.0"
      profile:
        description: >-
          Build profile. One of: reference, debug. reference is designed
          to support evaluation against goldens, while debug is intended
          to ensure no runtime checks trip.
        required: false
        type: string
        default: "reference"
      python_version:
        description: >-
          Version string for actions/setup-python (build-job Meson and
          collect-bundle).
        required: false
        type: string
        default: "3.12"
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact. Exactly `fvs-native-macos-<run_id>`.
        value: ${{ jobs.collect-and-finalize.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS)
    runs-on: ${{ inputs.runner_image }}
    defaults:
      run:
        shell: bash
    env:
      # Must match the macOS the runner's Homebrew GCC bottles were built for:
      # the static libgfortran.a objects carry that minimum, and a lower target
      # would claim support the runtime code was not built for. macos-15 ->
      # 15.0. Without it, minos follows the runner's macOS.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Later steps loop over $VARIANTS.
      - name: Resolve variant list
        id: variants
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: bash tools/ci/resolve_variants.sh

      - name: Install Homebrew GCC and Ninja
        id: toolchain
        env:
          V: ${{ inputs.gcc_major }}
        run: |
          set -euo pipefail
          brew update
          # The current major is only the unversioned `gcc` formula; there is
          # no gcc@N alias for it.
          CURRENT="$(brew info --json=v2 gcc | python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"].split(".")[0])')"
          if [ "$V" = "$CURRENT" ]; then FORMULA=gcc; else FORMULA="gcc@${V}"; fi
          brew install "$FORMULA" ninja
          echo "$(brew --prefix "$FORMULA")/bin" >> "$GITHUB_PATH"
          {
            echo "FC=gfortran-${V}"
            echo "CC=gcc-${V}"
            echo "CXX=g++-${V}"
            echo "GFORTRAN_PKG=${FORMULA}"
            echo "GPP_PKG=${FORMULA}"
          } >> "$GITHUB_ENV"
          # Cache keys cannot contain commas; keep the version line's identity.
          echo "fc_id=$("$(brew --prefix "$FORMULA")/bin/gfortran-${V}" --version | head -n 1 | tr -c 'A-Za-z0-9.\n-' '_')" >> "$GITHUB_OUTPUT"

      - id: prepare
        uses: ./.github/actions/prepare-fvs-native-checkout
        with:
          source_repo: ${{ inputs.source_repo }}
          source_ref: ${{ inputs.source_ref }}

      - name: Set up Python for Meson and parse_sourcelist.py
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pinned Meson
        env:
          MESON_VERSION: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          python3 -m pip install "meson==${MESON_VERSION}"

      # Ninja rebuilds any object older than its sources, and a fresh checkout
      # stamps every file with the current time, so a restored _build would be
      # rebuilt in full. Pin source timestamps to a fixed past date instead.
      # Safe because the cache key holds the source SHA (a hit means identical
      # sources) and the build-relevant overlay files; changed compile flags
      # still rebuild through Ninja's command-line tracking.
      - name: Pin source timestamps for the build cache
        run: find fvs-source fvs-build -name .git -prune -o -type f -exec touch -t 200001010000 {} +

      - name: Cache Meson build directory
        uses: actions/cache@v6
        with:
          path: _build
          key: >-
            meson-macos-${{ steps.variants.outputs.id }}-${{ steps.prepare.outputs.source_sha }}-${{
              inputs.profile }}-${{ steps.toolchain.outputs.fc_id }}-${{
              hashFiles(
                'fvs-build/meson.build',
                'fvs-build/meson_options.txt',
                'fvs-build/tools/parse_sourcelist.py',
                'fvs-build/tools/fvs_build_info.py',
                'fvs-build/tools/ci/provenance.py',
                'fvs-build/tools/ci/meson_configure_native.sh'
              )
            }}

      - name: Configure Meson
        env:
          PROFILE: ${{ inputs.profile }}
          FVS_SOURCE: ${{ github.workspace }}/fvs-source
          BUILD_DIR: _build
          OVERLAY_DIR: fvs-build
        run: bash fvs-build/tools/ci/meson_configure_native.sh

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      - name: Smoke-test the variant executables
        run: bash fvs-build/tools/ci/smoke_test_native.sh

      - name: Verify artifacts are self-contained (otool)
        run: |
          set -euo pipefail
          # Both the standalone exe and the fvs2py-loaded embedder library must
          # depend only on base-system libraries. A leaked Homebrew gcc runtime
          # (e.g. /opt/homebrew/opt/gcc@14/lib/gcc/14/libgfortran.5.dylib) or an
          # unresolved @rpath entry is absent on end-user Macs and fails at
          # dlopen/ctypes with OSError. With -static-libgfortran/-libgcc/
          # -libquadmath only /usr/lib and /System deps should remain.
          status=0
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v" "_build/FVS$v.so"); done
          for f in "${files[@]}"; do
            test -f "$f"
            echo "----- otool -L $f -----"
            otool -L "$f"
            base="$(basename "$f")"
            # Drop the header line, drop the lib's own install-id (matched by
            # basename so an @rpath/-prefixed id is handled too), then flag any
            # remaining dependency path outside the system prefixes.
            leaks="$(otool -L "$f" | tail -n +2 | awk '{print $1}' \
              | awk -v b="$base" '{ n=$0; sub(/.*\//,"",n); if (n != b) print }' \
              | grep -Ev '^(/usr/lib/|/System/)' || true)"
            if [ -n "$leaks" ]; then
              echo "ERROR: $f has non-system runtime dependencies:" >&2
              printf '%s\n' "$leaks" | sed 's/^/  /' >&2
              status=1
            fi
            minos="$(otool -l "$f" | awk '/LC_BUILD_VERSION/ {b=1} b && $1 == "minos" {print $2; exit}')"
            echo "minos: ${minos}"
            if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "ERROR: $f targets macOS ${minos}, expected ${MACOSX_DEPLOYMENT_TARGET}" >&2
              status=1
            fi
          done
          exit $status

      - name: Verify single GCC major in artifacts
        env:
          GCC_MAJOR: ${{ inputs.gcc_major }}
        run: |
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v" "_build/FVS$v.so"); done
          bash fvs-build/tools/ci/check_gcc_major.sh "${files[@]}"

      - name: Stage artifacts and per-variant build-info
        env:
          FVS_NATIVE_PLATFORM: darwin
          BUILD_PROFILE: ${{ inputs.profile }}
          MESON_BUILDTYPE: plain
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          FVS_BUILD_REPO: ${{ steps.prepare.outputs.overlay_repo }}
          FVS_BUILD_REF: ${{ steps.prepare.outputs.overlay_ref }}
          FVS_BUILD_SHA: ${{ steps.prepare.outputs.fvs_build_sha }}
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          GCC_MAJOR: ${{ inputs.gcc_major }}
          MESON_PIN: ${{ inputs.meson_version }}
        run: python3 fvs-build/tools/ci/stage_variant_native.py

      - name: Upload staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-staging
          path: staging/
          retention-days: 1
          if-no-files-found: error

  collect-and-finalize:
    name: Collect, SBOM, and finalize
    runs-on: ${{ inputs.runner_image }}
    needs: build
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - id: collect
        uses: ./.github/actions/collect-native-bundle
        with:
          fvs_native_platform: darwin
          staging_artifact: macos-staging
          artifact_name: fvs-native-macos-${{ github.run_id }}
          sbom_spdx_relpath: sbom/fvs-native-macos.spdx.json
          variants_input: ${{ inputs.variants }}
          runner_image: ${{ inputs.runner_image }}
          meson_version: ${{ inputs.meson_version }}
          python_version: ${{ inputs.python_version }}
          use_setup_python: "true"
