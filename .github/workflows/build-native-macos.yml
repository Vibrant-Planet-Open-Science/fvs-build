# Reusable workflow: native macOS FVS bundle (Homebrew GCC).
# Interface: docs/workflow-interface.md.

name: Build native macOS FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Empty builds the 22 US
          variants in tools/ci/resolve_variants.sh.
        required: false
        type: string
        default: ""
      profile:
        description: >-
          Build profile. One of: reference, debug. reference is designed
          to support evaluation against goldens, while debug is intended
          to ensure no runtime checks trip.
        required: false
        type: string
        default: "reference"
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact. Exactly `fvs-native-macos-aarch64-<run_id>`.
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    outputs:
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
    defaults:
      run:
        shell: bash
    env:
      # Must match the macOS the runner's Homebrew GCC bottles target: the
      # static libgfortran.a objects carry that minimum. Unset, minos follows
      # the runner's macOS.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      GCC_MAJOR: "15"
    steps:
      # In a called workflow github.* and a bare checkout are the caller's repo;
      # job.workflow_* is this repo, which tools/ needs.
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: fvs-build

      # fetch-depth: 0 because meson.build derives build-info macros from git in
      # this tree, and `git describe --tags` needs tags and history.
      - name: Check out FVS source tree
        id: source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: fvs-source
          submodules: recursive
          fetch-depth: 0

      # Later steps loop over $VARIANTS.
      - name: Resolve variant list
        id: variants
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: bash fvs-build/tools/ci/resolve_variants.sh

      - name: Install Homebrew GCC and Ninja
        id: toolchain
        run: |
          set -euo pipefail
          brew update
          # The current major is only the unversioned `gcc` formula; there is
          # no gcc@N alias for it.
          CURRENT="$(brew info --json=v2 gcc | python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"].split(".")[0])')"
          if [ "$GCC_MAJOR" = "$CURRENT" ]; then FORMULA=gcc; else FORMULA="gcc@${GCC_MAJOR}"; fi
          brew install "$FORMULA" ninja
          echo "$(brew --prefix "$FORMULA")/bin" >> "$GITHUB_PATH"
          {
            echo "FC=gfortran-${GCC_MAJOR}"
            echo "CC=gcc-${GCC_MAJOR}"
            echo "CXX=g++-${GCC_MAJOR}"
            echo "GFORTRAN_PKG=${FORMULA}"
            echo "GPP_PKG=${FORMULA}"
          } >> "$GITHUB_ENV"
          # Cache keys cannot contain commas; keep the version line's identity.
          echo "fc_id=$("$(brew --prefix "$FORMULA")/bin/gfortran-${GCC_MAJOR}" --version | head -n 1 | tr -c 'A-Za-z0-9.\n-' '_')" >> "$GITHUB_OUTPUT"

      - name: Set up Python for Meson and parse_sourcelist.py
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned Meson
        run: python3 -m pip install -r fvs-build/tools/ci/requirements-build.txt

      # A fresh checkout stamps files with the current time, so Ninja would
      # rebuild a restored _build in full. Safe because the cache key holds the
      # source SHA and overlay files; flag changes still rebuild via Ninja.
      - name: Pin source timestamps for the build cache
        run: find fvs-source fvs-build -name .git -prune -o -type f -exec touch -t 200001010000 {} +

      - name: Cache Meson build directory
        uses: actions/cache@v6
        with:
          path: _build
          key: >-
            meson-macos-${{ steps.variants.outputs.id }}-${{ steps.source.outputs.commit }}-${{
              inputs.profile }}-${{ steps.toolchain.outputs.fc_id }}-${{
              hashFiles(
                'fvs-build/meson.build',
                'fvs-build/meson_options.txt',
                'fvs-build/tools/parse_sourcelist.py',
                'fvs-build/tools/fvs_build_info.py',
                'fvs-build/tools/ci/meson_configure_native.sh',
                'fvs-build/tools/ci/requirements-build.txt'
              )
            }}

      - name: Configure Meson
        env:
          PROFILE: ${{ inputs.profile }}
          FVS_SOURCE: ${{ github.workspace }}/fvs-source
          BUILD_DIR: _build
          OVERLAY_DIR: fvs-build
        run: bash fvs-build/tools/ci/meson_configure_native.sh

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      - name: Smoke-test the variant executables
        run: bash fvs-build/tools/ci/smoke_test_native.sh

      - name: Verify artifacts are self-contained (otool)
        run: |
          set -euo pipefail
          # A leaked Homebrew GCC runtime path or unresolved @rpath entry is
          # absent on end-user Macs and fails at dlopen; with the static GCC
          # runtime only /usr/lib and /System deps should remain.
          status=0
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v" "_build/FVS$v.so"); done
          for f in "${files[@]}"; do
            test -f "$f"
            echo "----- otool -L $f -----"
            otool -L "$f"
            base="$(basename "$f")"
            # Skip the lib's own install-id, matched by basename so an
            # @rpath/-prefixed id is handled too.
            leaks="$(otool -L "$f" | tail -n +2 | awk '{print $1}' \
              | awk -v b="$base" '{ n=$0; sub(/.*\//,"",n); if (n != b) print }' \
              | grep -Ev '^(/usr/lib/|/System/)' || true)"
            if [ -n "$leaks" ]; then
              echo "ERROR: $f has non-system runtime dependencies:" >&2
              printf '%s\n' "$leaks" | sed 's/^/  /' >&2
              status=1
            fi
            minos="$(otool -l "$f" | awk '/LC_BUILD_VERSION/ {b=1} b && $1 == "minos" {print $2; exit}')"
            echo "minos: ${minos}"
            if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "ERROR: $f targets macOS ${minos}, expected ${MACOSX_DEPLOYMENT_TARGET}" >&2
              status=1
            fi
          done
          exit $status

      - name: Verify single GCC major in artifacts
        run: |
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v" "_build/FVS$v.so"); done
          bash fvs-build/tools/ci/check_gcc_major.sh "${files[@]}"

      - name: Bundle binaries, provenance and SBOM
        id: bundle
        env:
          VARIANTS_INPUT: ${{ inputs.variants }}
          BUILD_PROFILE: ${{ inputs.profile }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
          FVS_BUILD_REPO: ${{ job.workflow_repository }}
          FVS_BUILD_REF: ${{ job.workflow_ref }}
          FVS_BUILD_SHA: ${{ job.workflow_sha }}
          RUNNER_IMAGE: macos-15
        run: python3 fvs-build/tools/ci/provenance.py bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.artifact_name }}/
          retention-days: 30
          if-no-files-found: error
