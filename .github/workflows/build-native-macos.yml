# Reusable workflow: build native macOS FVS artifacts (Homebrew GCC / gfortran)
# via the fvs-build Meson overlay.
#
# Same structure as build-native-linux.yml / build-native-windows.yml; bundle
# uses extensionless executables and `libFVS<v>.dylib`.

name: Build native macOS FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Defaults to the 22 US
          variants that build cleanly on Linux; macOS may differ slightly.
        required: false
        type: string
        default: "ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws"
      runner_image:
        description: >-
          GitHub-hosted macOS runner label.
        required: false
        type: string
        default: "macos-latest"
      brew_gcc_major:
        description: >-
          Homebrew `gcc@N` version family (installs `brew install gcc@N`; sets
          FC=gfortran-N, CC=gcc-N, CXX=g++-N). Recorded in provenance as
          `gcc@N` for both Fortran and C++ labels.
        required: false
        type: string
        default: "14"
      meson_version:
        description: >-
          Exact Meson version installed via pip.
        required: false
        type: string
        default: "1.5.2"
      profile:
        description: >-
          Build profile. One of: reference, debug. Goldens are captured
          against reference only.
        required: false
        type: string
        default: "reference"
      python_version:
        description: >-
          Version string for actions/setup-python (preflight, matrix Meson,
          and collect-bundle).
        required: false
        type: string
        default: "3.12"
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact. Exactly `fvs-native-macos-<run_id>`.
        value: ${{ jobs.collect-and-finalize.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (expand variant matrix)
    runs-on: ${{ inputs.runner_image }}
    defaults:
      run:
        shell: bash
    outputs:
      matrix_variants: ${{ steps.matrix.outputs.matrix_variants }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Expand variants input into matrix JSON
        id: matrix
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: |
          python tools/ci/expand_variants_matrix.py

  build-variant:
    name: Build FVS${{ matrix.variant }}
    runs-on: ${{ inputs.runner_image }}
    needs: preflight
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.preflight.outputs.matrix_variants) }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Homebrew GCC and Ninja
        run: |
          set -euo pipefail
          brew update
          V="${{ inputs.brew_gcc_major }}"
          brew install "gcc@${V}" ninja
          GCC_PREFIX="$(brew --prefix "gcc@${V}")"
          echo "${GCC_PREFIX}/bin" >> "$GITHUB_PATH"
          {
            echo "FC=gfortran-${V}"
            echo "CC=gcc-${V}"
            echo "CXX=g++-${V}"
          } >> "$GITHUB_ENV"

      - id: prepare
        uses: ./.github/actions/prepare-fvs-native-checkout
        with:
          source_repo: ${{ inputs.source_repo }}
          source_ref: ${{ inputs.source_ref }}

      - name: Set up Python for Meson and parse_sourcelist.py
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pinned Meson
        env:
          MESON_VERSION: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "meson==${MESON_VERSION}"
          meson --version
          ninja --version
          "${FC}" --version | head -n 1

      - name: Cache Meson build directory
        uses: actions/cache@v5
        with:
          path: _build
          key: >-
            meson-macos-${{ matrix.variant }}-${{ inputs.source_ref }}-${{
              inputs.profile }}-${{
              hashFiles(
                'fvs-build/meson.build',
                'fvs-build/meson_options.txt',
                'fvs-build/tools/parse_sourcelist.py',
                'fvs-build/tools/ci/provenance.py',
                'fvs-build/tools/ci/meson_configure_native.sh'
              )
            }}

      - name: Configure Meson
        env:
          VARIANT: ${{ matrix.variant }}
          PROFILE: ${{ inputs.profile }}
          FVS_SOURCE: ${{ github.workspace }}/fvs-source
          BUILD_DIR: _build
          OVERLAY_DIR: fvs-build
        run: bash fvs-build/tools/ci/meson_configure_native.sh

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      - name: Smoke-test the variant executable
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          BIN_REL="_build/FVS${VARIANT}"
          if [ ! -x "$BIN_REL" ]; then
            echo "ERROR: ${BIN_REL} missing or not executable" >&2
            exit 1
          fi
          BIN_ABS="$(cd "$(dirname "$BIN_REL")" && pwd)/$(basename "$BIN_REL")"
          SMOKE_DIR=$(mktemp -d)
          OUTPUT="$( (cd "$SMOKE_DIR" && "$BIN_ABS" </dev/null 2>&1) || true )"
          rm -rf "$SMOKE_DIR"
          echo "----- smoke output (first 30 lines) -----"
          printf '%s\n' "$OUTPUT" | head -n 30
          echo "----- end smoke output -----"
          if ! printf '%s\n' "$OUTPUT" | grep -q 'STOP 20'; then
            echo "ERROR: smoke test for FVS${VARIANT} did not reach STOP 20" >&2
            exit 1
          fi

      - name: Stage artifacts and per-variant build-info
        env:
          FVS_NATIVE_PLATFORM: darwin
          BUILD_PROFILE: ${{ inputs.profile }}
          MESON_BUILDTYPE: plain
          VARIANT: ${{ matrix.variant }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          FVS_BUILD_REPO: ${{ steps.prepare.outputs.overlay_repo }}
          FVS_BUILD_REF: ${{ steps.prepare.outputs.overlay_ref }}
          FVS_BUILD_SHA: ${{ steps.prepare.outputs.fvs_build_sha }}
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          GFORTRAN_PKG: gcc@${{ inputs.brew_gcc_major }}
          GPP_PKG: gcc@${{ inputs.brew_gcc_major }}
          MESON_PIN: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          python3 fvs-build/tools/ci/stage_variant_native.py

      - name: Upload variant artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-variant-${{ matrix.variant }}
          path: staging/${{ matrix.variant }}/
          retention-days: 1
          if-no-files-found: error

  collect-and-finalize:
    name: Collect, SBOM, and finalize
    runs-on: ${{ inputs.runner_image }}
    needs: build-variant
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - id: collect
        uses: ./.github/actions/collect-native-bundle
        with:
          fvs_native_platform: darwin
          download_pattern: macos-variant-*
          artifact_name: fvs-native-macos-${{ github.run_id }}
          sbom_spdx_relpath: sbom/fvs-native-macos.spdx.json
          variants_input: ${{ inputs.variants }}
          runner_image: ${{ inputs.runner_image }}
          gfortran_package: gcc@${{ inputs.brew_gcc_major }}
          gpp_package: gcc@${{ inputs.brew_gcc_major }}
          meson_version: ${{ inputs.meson_version }}
          python_version: ${{ inputs.python_version }}
          use_setup_python: "true"
