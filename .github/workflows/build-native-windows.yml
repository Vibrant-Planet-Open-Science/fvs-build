# Reusable workflow: native Windows x86_64 FVS bundle (MSYS2 UCRT64).
# Interface: docs/workflow-interface.md.

name: Build native Windows x86_64 FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Defaults to empty, which
          builds all US variants. The Canadian variants (bc, on) are excluded
          by default due to incomplete upstream source lists.
        required: false
        type: string
        default: ""
      profile:
        description: >-
          Build profile. One of: reference, debug. reference is designed
          to support evaluation against goldens, while debug is intended
          to ensure no runtime checks trip.
        required: false
        type: string
        default: "reference"
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact. Exactly `fvs-native-windows-x86_64-<run_id>`.
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    # The target is set by the pinned MSYS2 toolchain, not the runner image.
    runs-on: windows-2025
    outputs:
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      MSYSTEM: UCRT64
      GCC_MAJOR: "15"
      # Installed as an exact set; see "Install pinned GCC toolchain".
      MSYS2_GCC_PACKAGES: >-
        mingw-w64-ucrt-x86_64-gcc-15.2.0-11
        mingw-w64-ucrt-x86_64-gcc-libs-15.2.0-11
        mingw-w64-ucrt-x86_64-gcc-fortran-15.2.0-11
        mingw-w64-ucrt-x86_64-gcc-libgfortran-15.2.0-11
        mingw-w64-ucrt-x86_64-crt-13.0.0.r488.g3fedac280-1
        mingw-w64-ucrt-x86_64-headers-13.0.0.r488.g3fedac280-1
        mingw-w64-ucrt-x86_64-winpthreads-13.0.0.r488.g3fedac280-1
        mingw-w64-ucrt-x86_64-libwinpthread-13.0.0.r488.g3fedac280-1
    steps:
      # In a called workflow github.* and a bare checkout are the caller's repo;
      # job.workflow_* is this repo, which tools/ needs.
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: fvs-build

      # fetch-depth: 0 because meson.build derives build-info macros from git in
      # this tree, and `git describe --tags` needs tags and history.
      - name: Check out FVS source tree
        id: source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: fvs-source
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # coreutils etc. come from the MSYS repo (no mingw-w64 builds). MSYS
          # git, not Git-for-Windows, is on PATH in UCRT64 shells. GCC comes
          # from the pinned set installed below.
          install: >-
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            coreutils
            findutils
            grep
            gawk
            git
            curl

      # Later steps loop over $VARIANTS.
      - name: Resolve variant list
        id: variants
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: bash fvs-build/tools/ci/resolve_variants.sh

      # MSYS2 carries one GCC at a time, and GCC, CRT, headers and winpthreads
      # must move together (USDAForestService/ForestVegetationSimulator#71), so
      # install an exact package set from the repo archive.
      - name: Install pinned GCC toolchain
        id: toolchain
        run: |
          set -euo pipefail
          read -ra PKGS <<< "$MSYS2_GCC_PACKAGES"
          DL=$(mktemp -d)
          for p in "${PKGS[@]}"; do
            curl -fsSL --retry 3 -o "${DL}/${p}-any.pkg.tar.zst" \
              "https://repo.msys2.org/mingw/ucrt64/${p}-any.pkg.tar.zst"
          done
          # UCRT64 Python and Ninja pull in the current GCC runtime. From
          # 16.2.0-4 that is split into cc-libs/libgcc/libstdc++/..., which
          # conflict with an older gcc-libs, so pacman -U refuses the pinned
          # set. Drop the runtime without dependency checks; the pinned set
          # reinstalls it (gcc-libs provides cc-libs).
          mapfile -t RUNTIME < <(pacman -Qq | grep -E '^mingw-w64-ucrt-x86_64-(cc-libs|libgcc|libstdc\+\+|libatomic|libquadmath|libgomp|libgfortran|gcc-libs|gcc-libgfortran)$' || true)
          if [ "${#RUNTIME[@]}" -gt 0 ]; then
            pacman -Rdd --noconfirm "${RUNTIME[@]}"
          fi
          pacman -U --noconfirm "${DL}"/*.pkg.tar.zst
          python -c 'import ssl, sqlite3'
          rm -rf "$DL"
          {
            echo "FC=gfortran"
            echo "CC=gcc"
            echo "CXX=g++"
            echo "GFORTRAN_PKG=$(printf '%s\n' "${PKGS[@]}" | grep '^mingw-w64-ucrt-x86_64-gcc-fortran-')"
            echo "GPP_PKG=$(printf '%s\n' "${PKGS[@]}" | grep '^mingw-w64-ucrt-x86_64-gcc-[0-9]')"
          } >> "$GITHUB_ENV"
          # Cache keys cannot contain commas; keep the version line's identity.
          echo "fc_id=$(gfortran --version | head -n 1 | tr -c 'A-Za-z0-9.\n-' '_')" >> "$GITHUB_OUTPUT"
          # CRT/headers bumps leave fc_id unchanged but must still miss the cache.
          echo "pkgs_id=$(sha256sum <<< "$MSYS2_GCC_PACKAGES" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Meson
        run: |
          set -euo pipefail
          # MSYS2's mingw python is PEP 668 "externally managed". The runner is
          # ephemeral and pacman has no pinnable Meson, so override it.
          python -m pip install --break-system-packages -r fvs-build/tools/ci/requirements-build.txt

      # A fresh checkout stamps files with the current time, so Ninja would
      # rebuild a restored _build in full. Safe because the cache key holds the
      # source SHA and overlay files; flag changes still rebuild via Ninja.
      - name: Pin source timestamps for the build cache
        run: find fvs-source fvs-build -name .git -prune -o -type f -exec touch -t 200001010000 {} +

      # Pull requests only: their cache scope can't reach main, while a dispatch
      # on main may build arbitrary source_repo code that could poison the
      # cache for later (release) runs. Those always build clean.
      - name: Cache Meson build directory
        if: github.event_name == 'pull_request'
        uses: actions/cache@v6
        with:
          path: _build
          key: >-
            meson-win-${{ steps.variants.outputs.id }}-${{ steps.source.outputs.commit }}-${{
              inputs.profile }}-${{ steps.toolchain.outputs.fc_id }}-${{
              steps.toolchain.outputs.pkgs_id }}-${{
              hashFiles(
                'fvs-build/meson.build',
                'fvs-build/meson_options.txt',
                'fvs-build/tools/parse_sourcelist.py',
                'fvs-build/tools/fvs_build_info.py',
                'fvs-build/tools/ci/meson_configure_native.sh',
                'fvs-build/tools/ci/requirements-build.txt'
              )
            }}

      - name: Configure Meson
        env:
          PROFILE: ${{ inputs.profile }}
          FVS_SOURCE: ${{ github.workspace }}/fvs-source
          BUILD_DIR: _build
          OVERLAY_DIR: fvs-build
        run: bash fvs-build/tools/ci/meson_configure_native.sh

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      - name: Smoke-test the variant executables
        run: bash fvs-build/tools/ci/smoke_test_native.sh

      - name: Verify artifacts are self-contained (objdump)
        run: |
          set -euo pipefail
          # Denylist the MinGW runtime DLLs rather than allowlist the (large,
          # unstable) Windows system set. msvcrt.dll means a MINGW64 object
          # slipped into this UCRT64 build.
          runtime='libgfortran|libgcc_s|libquadmath|libwinpthread|libstdc\+\+|libssp|msvcrt\.dll'
          status=0
          check() {
            f="$1"; pat="$2"
            test -f "$f"
            echo "----- objdump -p $f (DLL imports) -----"
            objdump -p "$f" | grep 'DLL Name:' || true
            if objdump -p "$f" | grep 'DLL Name:' | grep -qiE "$pat"; then
              echo "ERROR: $f imports a runtime/embedder DLL it must not" >&2
              status=1
            fi
          }
          for v in $VARIANTS; do
            check "_build/FVS${v}.exe" "FVS${v}\.dll|${runtime}"
            check "_build/FVS${v}.dll" "${runtime}"
          done
          exit $status

      - name: Verify single GCC major in artifacts
        run: |
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v.exe" "_build/FVS$v.dll"); done
          bash fvs-build/tools/ci/check_gcc_major.sh "${files[@]}"

      - name: Bundle binaries, provenance and SBOM
        id: bundle
        env:
          VARIANTS_INPUT: ${{ inputs.variants }}
          BUILD_PROFILE: ${{ inputs.profile }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
          FVS_BUILD_REPO: ${{ job.workflow_repository }}
          FVS_BUILD_REF: ${{ job.workflow_ref }}
          FVS_BUILD_SHA: ${{ job.workflow_sha }}
          RUNNER_IMAGE: windows-2025
        run: python fvs-build/tools/ci/provenance.py bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.artifact_name }}/
          retention-days: 30
          if-no-files-found: error
