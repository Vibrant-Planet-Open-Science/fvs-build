# Reusable workflow: build native Windows x86_64 FVS artifacts (MinGW-w64 / MSYS2)
# via the fvs-build Meson overlay.
#
# Same contract as build-native-linux.yml (per-variant matrix, bundle layout,
# provenance) with Windows paths (.exe / .dll). Downstream container packaging
# is Linux-only; this workflow is for native Windows delivery and validation.

name: Build native Windows x86_64 FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Defaults to the 22 US
          variants that build cleanly on Linux; Windows may differ slightly.
        required: false
        type: string
        default: "ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws"
      runner_image:
        description: >-
          GitHub-hosted Windows runner label (MSYS2 MINGW64 toolchain).
        required: false
        type: string
        default: "windows-latest"
      gfortran_package:
        description: >-
          MSYS2 pacman package name recorded in provenance (toolchain labels).
        required: false
        type: string
        default: "mingw-w64-x86_64-gcc-fortran"
      gpp_package:
        description: >-
          MSYS2 package providing gcc/g++ (provenance labels).
        required: false
        type: string
        default: "mingw-w64-x86_64-gcc"
      meson_version:
        description: >-
          Exact Meson version installed via pip (MINGW64 Python).
        required: false
        type: string
        default: "1.5.2"
      extra_fortran_args:
        description: >-
          Comma-separated extra Fortran flags passed through
          `-Dextra_fortran_args=`.
        required: false
        type: string
        default: ""
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact. Exactly `fvs-native-windows-<run_id>`.
        value: ${{ jobs.collect-and-finalize.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (expand variant matrix)
    runs-on: ${{ inputs.runner_image }}
    defaults:
      run:
        shell: bash
    outputs:
      matrix_variants: ${{ steps.matrix.outputs.matrix_variants }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Expand variants input into matrix JSON
        id: matrix
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: |
          python - <<'PY'
          import json
          import os

          csv = os.environ["VARIANTS_CSV"]
          seen = set()
          variants = []
          for part in csv.split(","):
              v = part.strip()
              if v and v not in seen:
                  seen.add(v)
                  variants.append(v)
          if not variants:
              raise SystemExit("ERROR: variants input expanded to an empty list")
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"matrix_variants={json.dumps(variants)}\n")
          print("Expanded variants:", json.dumps(variants))
          PY

  build-variant:
    name: Build FVS${{ matrix.variant }}
    runs-on: ${{ inputs.runner_image }}
    needs: preflight
    defaults:
      run:
        shell: msys2 {0}
    env:
      MSYSTEM: MINGW64
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.preflight.outputs.matrix_variants) }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-coreutils

      - name: Resolve fvs-build repo and ref from workflow_ref
        id: fb_ref
        uses: ./.github/actions/resolve-fvs-build-ref

      - name: Check out fvs-build (the Meson overlay)
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.fb_ref.outputs.repo }}
          ref: ${{ steps.fb_ref.outputs.ref }}
          path: fvs-build

      - name: Check out FVS source tree
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: fvs-source
          clean: true
          submodules: recursive

      - name: Remove stray Fortran .mod files from source tree
        run: |
          set -euo pipefail
          find fvs-source -name '*.mod' -type f -delete
          echo "Stripped any *.mod under fvs-source before Meson (see README)."

      - name: Capture source and fvs-build SHAs for provenance
        id: git_shas
        run: |
          set -euo pipefail
          SRC_SHA=$(git -C fvs-source rev-parse HEAD)
          FB_SHA=$(git -C fvs-build rev-parse HEAD)
          echo "source_sha=${SRC_SHA}" >> "$GITHUB_OUTPUT"
          echo "fvs_build_sha=${FB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Source SHA:     ${SRC_SHA}"
          echo "fvs-build SHA:  ${FB_SHA}"

      - name: Expose compilers for provenance metadata
        run: |
          set -euo pipefail
          {
            echo "FC=gfortran"
            echo "CC=gcc"
            echo "CXX=g++"
          } >> "$GITHUB_ENV"

      - name: Install pinned Meson
        env:
          MESON_VERSION: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "meson==${MESON_VERSION}"
          meson --version
          ninja --version
          gfortran --version | head -n 1

      - name: Cache Meson build directory
        uses: actions/cache@v5
        with:
          path: _build
          key: >-
            meson-win-${{ matrix.variant }}-${{ inputs.source_ref }}-${{
              hashFiles(
                'fvs-build/meson.build',
                'fvs-build/meson_options.txt',
                'fvs-build/tools/parse_sourcelist.py',
                'fvs-build/tools/ci/provenance.py'
              )
            }}

      - name: Configure Meson
        env:
          VARIANT: ${{ matrix.variant }}
          EXTRA_FORTRAN: ${{ inputs.extra_fortran_args }}
        run: |
          set -euo pipefail
          ARGS=(
            -Dfvs_source_dir="${GITHUB_WORKSPACE}/fvs-source"
            -Dvariants="${VARIANT}"
          )
          if [ -n "${EXTRA_FORTRAN}" ]; then
            ARGS+=(-Dextra_fortran_args="${EXTRA_FORTRAN}")
          fi
          if [ -d _build ]; then
            meson setup --reconfigure _build fvs-build "${ARGS[@]}"
          else
            meson setup _build fvs-build "${ARGS[@]}"
          fi

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      - name: Smoke-test the variant executable
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          BIN_REL="_build/FVS${VARIANT}.exe"
          if [ ! -f "$BIN_REL" ]; then
            echo "ERROR: ${BIN_REL} missing" >&2
            exit 1
          fi
          BIN_ABS=$(realpath "$BIN_REL" 2>/dev/null || cygpath -am "$BIN_REL")
          SMOKE_DIR=$(mktemp -d)
          OUTPUT="$( (cd "$SMOKE_DIR" && "$BIN_ABS" </dev/null 2>&1) || true )"
          rm -rf "$SMOKE_DIR"
          echo "----- smoke output (first 30 lines) -----"
          printf '%s\n' "$OUTPUT" | head -n 30
          echo "----- end smoke output -----"
          if ! printf '%s\n' "$OUTPUT" | grep -q 'STOP 20'; then
            echo "ERROR: smoke test for FVS${VARIANT} did not reach STOP 20" >&2
            exit 1
          fi

      - name: Stage artifacts and per-variant build-info
        env:
          FVS_NATIVE_PLATFORM: windows
          VARIANT: ${{ matrix.variant }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.git_shas.outputs.source_sha }}
          FVS_BUILD_REPO: ${{ steps.fb_ref.outputs.repo }}
          FVS_BUILD_REF: ${{ steps.fb_ref.outputs.ref }}
          FVS_BUILD_SHA: ${{ steps.git_shas.outputs.fvs_build_sha }}
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          GFORTRAN_PKG: ${{ inputs.gfortran_package }}
          GPP_PKG: ${{ inputs.gpp_package }}
          MESON_PIN: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          STAGE="staging/${VARIANT}"
          mkdir -p "${STAGE}/bin" "${STAGE}/lib" "${STAGE}/provenance/meson-logs"

          BIN_SRC="_build/FVS${VARIANT}.exe"
          SHLIB_SRC="_build/libFVS${VARIANT}.dll"
          if [ ! -f "${SHLIB_SRC}" ]; then
            echo "ERROR: expected DLL missing: ${SHLIB_SRC}" >&2
            exit 1
          fi
          cp "${BIN_SRC}" "${STAGE}/bin/FVS${VARIANT}.exe"
          cp "${SHLIB_SRC}" "${STAGE}/lib/libFVS${VARIANT}.dll"

          BIN_SHA=$(sha256sum "${STAGE}/bin/FVS${VARIANT}.exe" | awk '{print $1}')
          LIB_SHA=$(sha256sum "${STAGE}/lib/libFVS${VARIANT}.dll" | awk '{print $1}')
          GFORTRAN_VERSION=$(gfortran --version | head -n 1)
          GCC_VERSION=$(gcc --version | head -n 1)
          GPP_VERSION=$(g++ --version | head -n 1)
          NINJA_VERSION=$(ninja --version)
          MESON_VERSION_OUT=$(meson --version)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          export BIN_SHA LIB_SHA TIMESTAMP \
            GFORTRAN_VERSION GCC_VERSION GPP_VERSION \
            NINJA_VERSION MESON_VERSION_OUT
          python fvs-build/tools/ci/provenance.py write-build-info \
            --output "${STAGE}/provenance/build-info.json"

          if [ -f _build/meson-logs/meson-log.txt ]; then
            tail -c 200000 _build/meson-logs/meson-log.txt \
              > "${STAGE}/provenance/meson-logs/meson-log.tail.txt"
          fi

          echo "----- staged ${STAGE} -----"
          ls -laR "${STAGE}"

      - name: Upload variant artifact
        uses: actions/upload-artifact@v7
        with:
          name: variant-${{ matrix.variant }}
          path: staging/${{ matrix.variant }}/
          retention-days: 1
          if-no-files-found: error

  collect-and-finalize:
    name: Collect, SBOM, and finalize
    runs-on: ${{ inputs.runner_image }}
    needs: build-variant
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve fvs-build repo and ref from workflow_ref
        id: fb_ref
        uses: ./.github/actions/resolve-fvs-build-ref

      - name: Check out fvs-build (CI scripts)
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.fb_ref.outputs.repo }}
          ref: ${{ steps.fb_ref.outputs.ref }}
          path: fvs-build
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download all variant artifacts
        uses: actions/download-artifact@v7
        with:
          path: staging
          pattern: variant-*

      - name: Fan into canonical bundle layout
        id: bundle
        env:
          FVS_NATIVE_PLATFORM: windows
          ARTIFACT_NAME: fvs-native-windows-${{ github.run_id }}
          VARIANTS_INPUT: ${{ inputs.variants }}
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          GFORTRAN_PKG: ${{ inputs.gfortran_package }}
          GPP_PKG: ${{ inputs.gpp_package }}
          MESON_PIN: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          python fvs-build/tools/ci/provenance.py collect-bundle
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SPDX SBOM of bundled binaries
        env:
          BUNDLE: ${{ steps.bundle.outputs.artifact_name }}
        run: |
          set -euo pipefail
          syft scan "dir:${BUNDLE}" \
            -o "spdx-json=${BUNDLE}/sbom/fvs-native-windows.spdx.json"
          echo "SBOM size: $(wc -c < "${BUNDLE}/sbom/fvs-native-windows.spdx.json") bytes"

      - name: Upload bundled artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.artifact_name }}/
          retention-days: 30
          if-no-files-found: error
