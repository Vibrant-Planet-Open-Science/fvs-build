# Reusable workflow: build native Windows x86_64 FVS artifacts (MinGW-w64 / MSYS2)
# via the fvs-build Meson overlay.
#
# Same contract as build-native-linux.yml (per-variant matrix, bundle layout,
# provenance) with Windows paths (.exe / .dll). Downstream container packaging
# is Linux-only; this workflow is for native Windows delivery and validation.

name: Build native Windows x86_64 FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Defaults to the 22 US
          variants that build cleanly on Linux; Windows may differ slightly.
        required: false
        type: string
        default: "ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws"
      runner_image:
        description: >-
          GitHub-hosted Windows runner label (MSYS2 MINGW64 toolchain).
        required: false
        type: string
        default: "windows-latest"
      gfortran_package:
        description: >-
          MSYS2 pacman package name recorded in provenance (toolchain labels).
        required: false
        type: string
        default: "mingw-w64-x86_64-gcc-fortran"
      gpp_package:
        description: >-
          MSYS2 package providing gcc/g++ (provenance labels).
        required: false
        type: string
        default: "mingw-w64-x86_64-gcc"
      meson_version:
        description: >-
          Exact Meson version installed via pip (MINGW64 Python).
        required: false
        type: string
        default: "1.5.2"
      profile:
        description: >-
          Build profile. One of: reference, debug. reference is designed
          to support evaluation against goldens, while debug is intended
          to ensure no runtime checks trip.
        required: false
        type: string
        default: "reference"
      python_version:
        description: >-
          Version string for actions/setup-python (preflight, collect-bundle,
          and MINGW64 Meson via pip).
        required: false
        type: string
        default: "3.12"
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact. Exactly `fvs-native-windows-<run_id>`.
        value: ${{ jobs.collect-and-finalize.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (expand variant matrix)
    runs-on: ${{ inputs.runner_image }}
    defaults:
      run:
        shell: bash
    outputs:
      matrix_variants: ${{ steps.matrix.outputs.matrix_variants }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Expand variants input into matrix JSON
        id: matrix
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: |
          python tools/ci/expand_variants_matrix.py

  build-variant:
    name: Build FVS${{ matrix.variant }}
    runs-on: ${{ inputs.runner_image }}
    needs: preflight
    defaults:
      run:
        shell: msys2 {0}
    env:
      MSYSTEM: MINGW64
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.preflight.outputs.matrix_variants) }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # GNU coreutils are not packaged as mingw-w64-x86_64-coreutils; use MSYS repo tools on PATH.
          # MSYS `git` is on PATH in MINGW64 shells; Git-for-Windows is not (needed for rev-parse SHAs).
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            coreutils
            findutils
            grep
            gawk
            git

      - id: prepare
        uses: ./.github/actions/prepare-fvs-native-checkout
        with:
          source_repo: ${{ inputs.source_repo }}
          source_ref: ${{ inputs.source_ref }}
          run_shell: "msys2 {0}"

      - name: Expose compilers for provenance metadata
        run: |
          set -euo pipefail
          {
            echo "FC=gfortran"
            echo "CC=gcc"
            echo "CXX=g++"
          } >> "$GITHUB_ENV"

      - name: Install pinned Meson
        env:
          MESON_VERSION: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "meson==${MESON_VERSION}"
          meson --version
          ninja --version
          gfortran --version | head -n 1

      - name: Cache Meson build directory
        uses: actions/cache@v5
        with:
          path: _build
          key: >-
            meson-win-${{ matrix.variant }}-${{ inputs.source_ref }}-${{
              inputs.profile }}-${{
              hashFiles(
                'fvs-build/meson.build',
                'fvs-build/meson_options.txt',
                'fvs-build/tools/parse_sourcelist.py',
                'fvs-build/tools/ci/provenance.py',
                'fvs-build/tools/ci/meson_configure_native.sh'
              )
            }}

      - name: Configure Meson
        env:
          VARIANT: ${{ matrix.variant }}
          PROFILE: ${{ inputs.profile }}
          FVS_SOURCE: ${{ github.workspace }}/fvs-source
          BUILD_DIR: _build
          OVERLAY_DIR: fvs-build
        run: bash fvs-build/tools/ci/meson_configure_native.sh

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      - name: Smoke-test the variant executable
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          BIN_REL="_build/FVS${VARIANT}.exe"
          if [ ! -f "$BIN_REL" ]; then
            echo "ERROR: ${BIN_REL} missing" >&2
            exit 1
          fi
          BIN_ABS=$(realpath "$BIN_REL" 2>/dev/null || cygpath -am "$BIN_REL")
          SMOKE_DIR=$(mktemp -d)
          OUTPUT="$( (cd "$SMOKE_DIR" && "$BIN_ABS" </dev/null 2>&1) || true )"
          rm -rf "$SMOKE_DIR"
          echo "----- smoke output (first 30 lines) -----"
          printf '%s\n' "$OUTPUT" | head -n 30
          echo "----- end smoke output -----"
          if ! printf '%s\n' "$OUTPUT" | grep -q 'STOP 20'; then
            echo "ERROR: smoke test for FVS${VARIANT} did not reach STOP 20" >&2
            exit 1
          fi

      - name: Stage artifacts and per-variant build-info
        env:
          FVS_NATIVE_PLATFORM: windows
          BUILD_PROFILE: ${{ inputs.profile }}
          MESON_BUILDTYPE: plain
          VARIANT: ${{ matrix.variant }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          FVS_BUILD_REPO: ${{ steps.prepare.outputs.overlay_repo }}
          FVS_BUILD_REF: ${{ steps.prepare.outputs.overlay_ref }}
          FVS_BUILD_SHA: ${{ steps.prepare.outputs.fvs_build_sha }}
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          GFORTRAN_PKG: ${{ inputs.gfortran_package }}
          GPP_PKG: ${{ inputs.gpp_package }}
          MESON_PIN: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          python fvs-build/tools/ci/stage_variant_native.py

      - name: Upload variant artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-variant-${{ matrix.variant }}
          path: staging/${{ matrix.variant }}/
          retention-days: 1
          if-no-files-found: error

  collect-and-finalize:
    name: Collect, SBOM, and finalize
    runs-on: ${{ inputs.runner_image }}
    needs: build-variant
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - id: collect
        uses: ./.github/actions/collect-native-bundle
        with:
          fvs_native_platform: windows
          download_pattern: windows-variant-*
          artifact_name: fvs-native-windows-${{ github.run_id }}
          sbom_spdx_relpath: sbom/fvs-native-windows.spdx.json
          variants_input: ${{ inputs.variants }}
          runner_image: ${{ inputs.runner_image }}
          gfortran_package: ${{ inputs.gfortran_package }}
          gpp_package: ${{ inputs.gpp_package }}
          meson_version: ${{ inputs.meson_version }}
          python_version: ${{ inputs.python_version }}
          use_setup_python: "true"
          python_cmd: python
