# Reusable workflow: build native Windows x86_64 FVS artifacts (MSYS2 UCRT64)
# via the fvs-build Meson overlay.
#
# Same contract as build-native-linux.yml (one build job, bundle layout,
# provenance) with Windows paths (.exe / .dll). Downstream container packaging
# is Linux-only; this workflow is for native Windows delivery and validation.

name: Build native Windows x86_64 FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Defaults to the 22 US
          variants that build cleanly on Linux; Windows may differ slightly.
        required: false
        type: string
        default: "ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws"
      runner_image:
        description: >-
          GitHub-hosted Windows runner label (MSYS2 UCRT64 toolchain).
        required: false
        type: string
        default: "windows-latest"
      gcc_major:
        description: >-
          GCC major version. Installs the exact MSYS2 package set listed for
          this major in tools/ci/msys2-toolchains.json (GCC plus the matching
          CRT, headers and winpthreads); a major with no entry fails before
          compiling.
        required: false
        type: string
        default: "15"
      meson_version:
        description: >-
          Exact Meson version installed via pip (UCRT64 Python).
        required: false
        type: string
        default: "1.12.0"
      profile:
        description: >-
          Build profile. One of: reference, debug. reference is designed
          to support evaluation against goldens, while debug is intended
          to ensure no runtime checks trip.
        required: false
        type: string
        default: "reference"
      python_version:
        description: >-
          Version string for actions/setup-python in collect-bundle.
        required: false
        type: string
        default: "3.12"
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact. Exactly `fvs-native-windows-<run_id>`.
        value: ${{ jobs.collect-and-finalize.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: ${{ inputs.runner_image }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      MSYSTEM: UCRT64
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # GNU coreutils are not packaged as mingw-w64-ucrt-x86_64-coreutils; use MSYS repo tools on PATH.
          # MSYS `git` is on PATH in UCRT64 shells; Git-for-Windows is not (needed for rev-parse SHAs).
          # GCC is not listed here: it comes from the pinned set installed below.
          install: >-
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            coreutils
            findutils
            grep
            gawk
            git
            curl

      # Later steps loop over $VARIANTS.
      - name: Resolve variant list
        id: variants
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: bash tools/ci/resolve_variants.sh

      - id: prepare
        uses: ./.github/actions/prepare-fvs-native-checkout
        with:
          source_repo: ${{ inputs.source_repo }}
          source_ref: ${{ inputs.source_ref }}
          run_shell: "msys2 {0}"

      # MSYS2 carries one GCC at a time, and GCC, CRT, headers and winpthreads
      # must move together (USDAForestService/ForestVegetationSimulator#71), so
      # install an exact package set from the repo archive rather than the
      # current release. pacman -U resolves the remaining dependencies.
      - name: Install pinned GCC toolchain (gcc_major)
        id: toolchain
        env:
          V: ${{ inputs.gcc_major }}
        run: |
          set -euo pipefail
          mapfile -t PKGS < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1])).get(sys.argv[2], [])))' \
            fvs-build/tools/ci/msys2-toolchains.json "$V" | tr -d '\r')
          if [ "${#PKGS[@]}" -eq 0 ] || [ -z "${PKGS[0]}" ]; then
            echo "ERROR: gcc_major=${V} has no entry in tools/ci/msys2-toolchains.json" >&2
            exit 1
          fi
          DL=$(mktemp -d)
          for p in "${PKGS[@]}"; do
            curl -fsSL --retry 3 -o "${DL}/${p}-any.pkg.tar.zst" \
              "https://repo.msys2.org/mingw/ucrt64/${p}-any.pkg.tar.zst"
          done
          # UCRT64 Python and Ninja pull in the current GCC runtime. From
          # 16.2.0-4 that is split into cc-libs/libgcc/libstdc++/..., which
          # conflict with an older gcc-libs, so pacman -U refuses the pinned
          # set. Drop the runtime without dependency checks; the pinned set
          # reinstalls it (gcc-libs provides cc-libs).
          mapfile -t RUNTIME < <(pacman -Qq | grep -E '^mingw-w64-ucrt-x86_64-(cc-libs|libgcc|libstdc\+\+|libatomic|libquadmath|libgomp|libgfortran|gcc-libs|gcc-libgfortran)$' || true)
          if [ "${#RUNTIME[@]}" -gt 0 ]; then
            pacman -Rdd --noconfirm "${RUNTIME[@]}"
          fi
          pacman -U --noconfirm "${DL}"/*.pkg.tar.zst
          python -c 'import ssl, sqlite3'
          rm -rf "$DL"
          {
            echo "FC=gfortran"
            echo "CC=gcc"
            echo "CXX=g++"
            echo "GFORTRAN_PKG=$(printf '%s\n' "${PKGS[@]}" | grep '^mingw-w64-ucrt-x86_64-gcc-fortran-')"
            echo "GPP_PKG=$(printf '%s\n' "${PKGS[@]}" | grep '^mingw-w64-ucrt-x86_64-gcc-[0-9]')"
          } >> "$GITHUB_ENV"
          # Cache keys cannot contain commas; keep the version line's identity.
          echo "fc_id=$(gfortran --version | head -n 1 | tr -c 'A-Za-z0-9.\n-' '_')" >> "$GITHUB_OUTPUT"

      - name: Install pinned Meson
        env:
          MESON_VERSION: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          # MSYS2's mingw python is PEP 668 "externally managed" (marker added
          # with the Python 3.14 packages), so pip refuses to install into it
          # without an override. The runner is ephemeral and Meson is not
          # packaged at a pinnable version in pacman, so overriding is fine;
          # pacman-managed pip is left alone (no self-upgrade).
          python -m pip install --break-system-packages "meson==${MESON_VERSION}"

      # Ninja rebuilds any object older than its sources, and a fresh checkout
      # stamps every file with the current time, so a restored _build would be
      # rebuilt in full. Pin source timestamps to a fixed past date instead.
      # Safe because the cache key holds the source SHA (a hit means identical
      # sources) and the build-relevant overlay files; changed compile flags
      # still rebuild through Ninja's command-line tracking.
      - name: Pin source timestamps for the build cache
        run: find fvs-source fvs-build -name .git -prune -o -type f -exec touch -t 200001010000 {} +

      - name: Cache Meson build directory
        uses: actions/cache@v6
        with:
          path: _build
          key: >-
            meson-win-${{ steps.variants.outputs.id }}-${{ steps.prepare.outputs.source_sha }}-${{
              inputs.profile }}-${{ steps.toolchain.outputs.fc_id }}-${{
              hashFiles(
                'fvs-build/meson.build',
                'fvs-build/meson_options.txt',
                'fvs-build/tools/parse_sourcelist.py',
                'fvs-build/tools/fvs_build_info.py',
                'fvs-build/tools/ci/provenance.py',
                'fvs-build/tools/ci/meson_configure_native.sh',
                'fvs-build/tools/ci/msys2-toolchains.json'
              )
            }}

      - name: Configure Meson
        env:
          PROFILE: ${{ inputs.profile }}
          FVS_SOURCE: ${{ github.workspace }}/fvs-source
          BUILD_DIR: _build
          OVERLAY_DIR: fvs-build
        run: bash fvs-build/tools/ci/meson_configure_native.sh

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      - name: Smoke-test the variant executables
        run: bash fvs-build/tools/ci/smoke_test_native.sh

      - name: Verify artifacts are self-contained (objdump)
        run: |
          set -euo pipefail
          # -static build: neither the standalone exe nor the embedder DLL may
          # import a MinGW/MSYS2 runtime DLL (absent on end-user Windows) and
          # the exe must not import the embedder DLL. Denylist the runtime DLLs
          # rather than allowlist the (large, unstable) Windows system set.
          # msvcrt.dll means a MINGW64 object slipped into this UCRT64 build.
          runtime='libgfortran|libgcc_s|libquadmath|libwinpthread|libstdc\+\+|libssp|msvcrt\.dll'
          status=0
          check() {
            f="$1"; pat="$2"
            test -f "$f"
            echo "----- objdump -p $f (DLL imports) -----"
            objdump -p "$f" | grep 'DLL Name:' || true
            if objdump -p "$f" | grep 'DLL Name:' | grep -qiE "$pat"; then
              echo "ERROR: $f imports a runtime/embedder DLL it must not" >&2
              status=1
            fi
          }
          for v in $VARIANTS; do
            check "_build/FVS${v}.exe" "FVS${v}\.dll|${runtime}"
            check "_build/FVS${v}.dll" "${runtime}"
          done
          exit $status

      - name: Verify single GCC major in artifacts
        env:
          GCC_MAJOR: ${{ inputs.gcc_major }}
        run: |
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v.exe" "_build/FVS$v.dll"); done
          bash fvs-build/tools/ci/check_gcc_major.sh "${files[@]}"

      - name: Stage artifacts and per-variant build-info
        env:
          FVS_NATIVE_PLATFORM: windows
          BUILD_PROFILE: ${{ inputs.profile }}
          MESON_BUILDTYPE: plain
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          FVS_BUILD_REPO: ${{ steps.prepare.outputs.overlay_repo }}
          FVS_BUILD_REF: ${{ steps.prepare.outputs.overlay_ref }}
          FVS_BUILD_SHA: ${{ steps.prepare.outputs.fvs_build_sha }}
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          GCC_MAJOR: ${{ inputs.gcc_major }}
          MESON_PIN: ${{ inputs.meson_version }}
        run: python fvs-build/tools/ci/stage_variant_native.py

      - name: Upload staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-staging
          path: staging/
          retention-days: 1
          if-no-files-found: error

  collect-and-finalize:
    name: Collect, SBOM, and finalize
    runs-on: ${{ inputs.runner_image }}
    needs: build
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - id: collect
        uses: ./.github/actions/collect-native-bundle
        with:
          fvs_native_platform: windows
          staging_artifact: windows-staging
          artifact_name: fvs-native-windows-${{ github.run_id }}
          sbom_spdx_relpath: sbom/fvs-native-windows.spdx.json
          variants_input: ${{ inputs.variants }}
          runner_image: ${{ inputs.runner_image }}
          meson_version: ${{ inputs.meson_version }}
          python_version: ${{ inputs.python_version }}
          use_setup_python: "true"
          python_cmd: python
