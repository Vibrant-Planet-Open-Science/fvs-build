name: Test FVS GUI container (pull request)

on:
  pull_request:
    branches:
      - main
    paths:
      - docker/Dockerfile.fvs-gui
      - docker/fvs-gui/**
      - .github/workflows/build-container-fvs-gui-linux.yml
      - .github/workflows/ci-test-fvs-gui-container.yml
      - tools/ci/smoke_fvs_gui.sh
      # The image is built from the native bundle, so changes to how it's built
      # or laid out need this test too.
      - .github/workflows/build-native-linux.yml
      - .github/actions/**
      - tools/ci/provenance.py

concurrency:
  group: ci-fvs-gui-${{ github.ref }}
  cancel-in-progress: true

# packages: write is never used (push: false), but the called workflow declares
# it and cannot get more than its caller grants: without it, startup_failure.
permissions:
  contents: read
  packages: write

jobs:
  native:
    name: Native binary build
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      runner_image: ubuntu-24.04
      profile: reference

  # Apple Silicon Macs run the arm64 image locally, so test it on every PR.
  native-arm64:
    name: Native binary build (arm64)
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: USDAForestService/ForestVegetationSimulator
      source_ref: 2027.1.0
      runner_image: ubuntu-24.04-arm
      profile: reference

  fvs-gui-container:
    name: FVS GUI container build + smoke
    needs: [native, native-arm64]
    uses: ./.github/workflows/build-container-fvs-gui-linux.yml
    with:
      artifact_name: ${{ needs.native.outputs.artifact_name }}
      artifact_name_arm64: ${{ needs.native-arm64.outputs.artifact_name }}
      interface_ref: "20261109"
      image_name: usfs-fvs-gui
      image_tag: ci-${{ github.run_id }}
      push: false
