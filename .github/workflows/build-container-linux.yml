# Reusable workflow: package build-native-linux.yml bundles into the runtime
# image, one runner per arch (no QEMU). Interface: docs/workflow-interface.md.

name: Build Linux runtime container image (reusable)

on:
  workflow_call:
    inputs:
      artifact_name:
        description: >-
          Name of the x86_64 fvs-native-linux artifact bundle produced by a
          prior build-native-linux.yml job in the same workflow run. Typically
          `fvs-native-linux-x86_64-<run_id>` -- pass the upstream job's
          `artifact_name` output through unchanged.
        required: true
        type: string
      artifact_name_arm64:
        description: >-
          Name of the aarch64 bundle from a second build-native-linux.yml job
          (runner_image: ubuntu-24.04-arm). When set, the image is also built
          for linux/arm64 and the tags point at a two-arch manifest list.
          Empty (default) builds linux/amd64 only.
        required: false
        type: string
        default: ""
      image_name:
        description: >-
          Fully-qualified image name without the tag suffix, e.g.
          `ghcr.io/vibrant-planet-open-science/usfs-fvs`. The two-namespace
          split is the caller's choice; this workflow accepts whatever
          name is supplied.
        required: true
        type: string
      image_tag:
        description: >-
          Primary tag for the built image, e.g. `2027.1.0` for a USFS release.
        required: true
        type: string
      image_extra_tags:
        description: >-
          Comma-separated additional tags applied at push time. Common
          choices: `latest`, `<source_sha_short>`. Each tag points at the
          same manifest list as the primary tag. Empty by default.
        required: false
        type: string
        default: ""
      runtime_base:
        description: >-
          Base image for the runtime container. Needs glibc 2.28 or newer
          (the binaries are built in manylinux_2_28).
        required: false
        type: string
        default: "ubuntu:24.04"
      runner_image:
        description: >-
          GitHub-hosted runner image label for the amd64 leg and the
          manifest job. The arm64 leg always runs on ubuntu-24.04-arm.
        required: false
        type: string
        default: "ubuntu-24.04"
      push:
        description: >-
          Push the built image to the registry after the image build succeeds.
          Defaults to false so dispatch / dry-run callers do not
          accidentally publish; production callers (release pipelines)
          must explicitly set true.
        required: false
        type: boolean
        default: false
    outputs:
      image_ref:
        description: "Primary image reference: <image_name>:<image_tag>."
        value: ${{ jobs.build.outputs.image_ref }}
      image_digest:
        description: >-
          Digest of the manifest list behind the tags, in `sha256:...` form.
          Empty unless `push: true`, since digests are only stable for
          pushed images.
        value: ${{ jobs.manifest.outputs.image_digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }} and (optionally) push by digest
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || inputs.runner_image }}
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ inputs.artifact_name_arm64 == '' && 'arm64' || 'none' }}
    outputs:
      image_ref: ${{ steps.refs.outputs.image_ref }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      # In a called workflow github.* and a bare checkout are the caller's repo;
      # job.workflow_* is this repo, which ./.github/actions and tools/ need.
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1

      - name: Download fvs-native-linux artifact bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.arch == 'arm64' && inputs.artifact_name_arm64 || inputs.artifact_name }}
          path: bundle

      - name: Verify bundle layout matches the artifact contract
        run: |
          set -euo pipefail
          for required in \
            bundle/provenance/manifest.json \
            bundle/sbom/fvs-native-linux.spdx.json
          do
            if [ ! -f "$required" ]; then
              echo "ERROR: bundle missing required file: ${required}" >&2
              exit 1
            fi
          done
          shopt -s nullglob
          bins=(bundle/FVS*)
          libs=(bundle/FVS*.so)
          shopt -u nullglob
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "ERROR: no bundle/FVS* executables at bundle root" >&2
            exit 1
          fi
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "ERROR: no bundle/FVS*.so at bundle root" >&2
            exit 1
          fi
          echo "Bundle layout OK; executables:"
          printf '%s\n' "${bins[@]}"
          echo "shared libraries:"
          printf '%s\n' "${libs[@]}"

      # Exports the manifest's provenance fields to $GITHUB_ENV for later steps.
      - name: Extract provenance from bundle manifest
        id: provenance
        run: |
          set -euo pipefail
          python3 tools/ci/provenance.py manifest-to-github-env

      # Catches an aarch64 bundle passed as artifact_name (or the reverse),
      # which would otherwise be published under the wrong platform.
      - name: Verify bundle arch matches this leg
        run: |
          case "${BUNDLE_ARCH}:${ARCH}" in
            x86_64:amd64|aarch64:arm64) echo "bundle arch ${BUNDLE_ARCH} matches linux/${ARCH}" ;;
            *) echo "ERROR: bundle is ${BUNDLE_ARCH}, but this is the linux/${ARCH} leg" >&2; exit 1 ;;
          esac

      - name: Compose image references
        id: refs
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image_ref=${IMAGE_REF}"      >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=${IMAGE_REF}"      >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --load for the SBOM scan; the push step reruns the saved arguments from
      # the builder cache, so a failed build never reaches the registry.
      - name: Build runtime image (load locally)
        run: |
          set -euo pipefail
          args=(
            --platform "linux/${ARCH}"
            --build-arg RUNTIME_BASE="${{ inputs.runtime_base }}"
            --build-arg SOURCE_REPO="${SOURCE_REPO}"
            --build-arg SOURCE_REF="${SOURCE_REF}"
            --build-arg SOURCE_SHA="${SOURCE_SHA}"
            --build-arg FVS_BUILD_REPO="${FVS_BUILD_REPO}"
            --build-arg FVS_BUILD_REF="${FVS_BUILD_REF}"
            --build-arg FVS_BUILD_SHA="${FVS_BUILD_SHA}"
            --build-arg VARIANTS="${VARIANTS_BUILT}"
            --build-arg GFORTRAN_VERSION="${GFORTRAN_VERSION}"
            --build-arg MESON_VERSION="${MESON_VERSION}"
            --build-arg TIMESTAMP="${TIMESTAMP}"
            -f docker/Dockerfile.runtime
            .
          )
          printf '%s\n' "${args[@]}" > "${RUNNER_TEMP}/buildx-args"
          docker buildx build --load --tag "${IMAGE_REF}" "${args[@]}"

      - name: Log in to GHCR
        if: inputs.push && startsWith(inputs.image_name, 'ghcr.io/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push untagged, by digest; the manifest job applies the tags. Matrix
      # legs cannot hand per-leg outputs to a later job, so the digest
      # travels as a small artifact.
      - name: Push image by digest
        if: inputs.push
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          mapfile -t args < "${RUNNER_TEMP}/buildx-args"
          docker buildx build "${args[@]}" \
            --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${RUNNER_TEMP}/metadata.json"
          mkdir -p "${RUNNER_TEMP}/digests"
          jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json" > "${RUNNER_TEMP}/digests/${ARCH}"
          echo "Pushed ${IMAGE_NAME}@$(cat "${RUNNER_TEMP}/digests/${ARCH}") (${ARCH})"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: container-digest-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

      - name: Install syft (for image SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SPDX SBOM of built image
        run: |
          set -euo pipefail
          syft scan "${IMAGE_REF}" \
            -o "spdx-json=container-sbom.spdx.json"
          echo "Image SBOM size: $(wc -c < container-sbom.spdx.json) bytes"

      - name: Upload image SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: container-sbom-${{ matrix.arch }}-${{ github.run_id }}
          path: container-sbom.spdx.json
          retention-days: 30
          if-no-files-found: error

  # An amd64-only call still produces a (one-entry) manifest list.
  manifest:
    name: Create multi-arch manifest list
    needs: build
    if: inputs.push
    runs-on: ${{ inputs.runner_image }}
    outputs:
      image_digest: ${{ steps.create.outputs.image_digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: container-digest-*-${{ github.run_id }}
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        if: startsWith(inputs.image_name, 'ghcr.io/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest list
        id: create
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_EXTRA_TAGS: ${{ inputs.image_extra_tags }}
        run: |
          set -euo pipefail
          tags=(--tag "${IMAGE_REF}")
          IFS=',' read -ra EXTRA <<< "${IMAGE_EXTRA_TAGS}"
          for T in "${EXTRA[@]}"; do
            T_TRIM=$(echo "$T" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
            if [ -n "$T_TRIM" ]; then tags+=(--tag "${IMAGE_NAME}:${T_TRIM}"); fi
          done
          sources=()
          for f in digests/*; do
            sources+=("${IMAGE_NAME}@$(cat "$f")")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_REF}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_REF}" --format '{{.Manifest.Digest}}')
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_REF} (manifest list digest: ${DIGEST})"
