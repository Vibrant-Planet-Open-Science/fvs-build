# Local-dev driver for the full native + container pipeline.
#
# This is a thin workflow_dispatch wrapper that demonstrates the
# orchestrator pattern documented in docs/workflow-interface.md:
# call build-native-linux first, then call build-container-linux with
# `needs:` on the native job, passing the artifact name through.
#
# Defaults assume an upstream-tracking build (USDAForestService source +
# ghcr.io/<owner>/usfs-fvs namespace). `push` defaults to false so a
# manual dispatch never accidentally publishes; operator must explicitly
# set push=true for production-style runs.
#
# This is NOT a caller interface for other repos -- they should compose
# the two reusable workflows themselves, matching their own release ref
# discipline.

name: Dispatch native + container build (manual)

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo (owner/name)"
        required: true
        default: "USDAForestService/ForestVegetationSimulator"
        type: string
      source_ref:
        description: "Source ref (tag, branch, or SHA)"
        required: true
        default: "FS2026.3"
        type: string
      variants:
        description: "Comma-separated FVS variant codes (default: 22 known-good US variants)"
        required: false
        default: "ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws"
        type: string
      image_name:
        description: "Fully-qualified image name without tag (defaults to ghcr.io/<owner>/usfs-fvs)"
        required: false
        default: ""
        type: string
      image_tag:
        description: "Primary image tag (typically matches source_ref)"
        required: true
        default: "FS2026.3"
        type: string
      image_extra_tags:
        description: "Comma-separated extra tags (e.g. latest)"
        required: false
        default: ""
        type: string
      push:
        description: "Push to GHCR after the container image build succeeds"
        required: false
        default: false
        type: boolean
      arm64:
        description: "Also build linux/arm64 (native aarch64 bundle + multi-arch image)"
        required: false
        default: true
        type: boolean
      runner_image:
        description: "Runner image label for the amd64 jobs"
        required: false
        default: "ubuntu-24.04"
        type: string
      python_version:
        description: "actions/setup-python for the native Linux build job"
        required: false
        default: "3.12"
        type: string
      gcc_major:
        description: "GCC major version for the native Linux build (noble archive: 9-14)"
        required: false
        default: "14"
        type: string
        # Note: meson_version and runtime_base are not exposed here; they
        # follow the reusable workflows' defaults (pinned Meson, runtime base).

permissions:
  contents: read
  packages: write

jobs:
  # Tiny preflight job to compute the default image_name when the operator
  # leaves it blank. workflow_dispatch input defaults cannot reference
  # github.repository_owner at definition time, so we derive it here and
  # hand it to the container workflow via `with:`.
  resolve-image-name:
    name: Resolve image_name default
    runs-on: ${{ inputs.runner_image }}
    outputs:
      image_name: ${{ steps.resolve.outputs.image_name }}
    steps:
      - name: Pick image_name
        id: resolve
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_NAME}" ]; then
            IMAGE_NAME="${INPUT_IMAGE_NAME}"
          else
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/${OWNER_LC}/usfs-fvs"
          fi
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_name resolved to: ${IMAGE_NAME}"

  native:
    name: Native binary build
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: ${{ inputs.source_repo }}
      source_ref: ${{ inputs.source_ref }}
      variants: ${{ inputs.variants }}
      runner_image: ${{ inputs.runner_image }}
      python_version: ${{ inputs.python_version }}
      gcc_major: ${{ inputs.gcc_major }}

  native-arm64:
    name: Native binary build (arm64)
    if: inputs.arm64
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: ${{ inputs.source_repo }}
      source_ref: ${{ inputs.source_ref }}
      variants: ${{ inputs.variants }}
      runner_image: ubuntu-24.04-arm
      python_version: ${{ inputs.python_version }}
      gcc_major: ${{ inputs.gcc_major }}

  container:
    name: Container build
    needs: [resolve-image-name, native, native-arm64]
    # Run when native-arm64 was skipped (arm64: false), not only on success.
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/build-container-linux.yml
    with:
      artifact_name: ${{ needs.native.outputs.artifact_name }}
      artifact_name_arm64: ${{ needs.native-arm64.outputs.artifact_name }}
      image_name: ${{ needs.resolve-image-name.outputs.image_name }}
      image_tag: ${{ inputs.image_tag }}
      image_extra_tags: ${{ inputs.image_extra_tags }}
      runner_image: ${{ inputs.runner_image }}
      push: ${{ inputs.push }}
    secrets: inherit
