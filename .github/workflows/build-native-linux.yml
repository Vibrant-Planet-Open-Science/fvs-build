# Reusable workflow: build native Linux FVS artifacts via the fvs-build
# Meson overlay. Runs on x86_64 or aarch64: the runner_image picks the arch
# (ubuntu-24.04 or ubuntu-24.04-arm). A caller wanting both calls it twice.
#
# This workflow is source-agnostic. Callers supply a source repo URL and
# ref; this workflow produces a single artifact bundle (per-variant
# binaries + shared libraries + provenance manifest + SBOM) that downstream
# callers consume.
#
# Container packaging is intentionally out of scope for this workflow;
# this workflow's artifacts may be consumed by a separate container workflow
# via its `artifact_name` output.

name: Build native Linux FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Defaults to the 22
          cleanly-buildable US variants. The Canadian variants (bc, on)
          are excluded by default due to incomplete upstream source lists.
        required: false
        type: string
        default: "ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws"
      runner_image:
        description: >-
          GitHub-hosted runner image label. Pinned to keep the glibc baseline
          stable and matched to the runtime container base. ubuntu-24.04
          builds x86_64; ubuntu-24.04-arm builds aarch64.
        required: false
        type: string
        default: "ubuntu-24.04"
      gcc_major:
        description: >-
          GCC major version. Installs gfortran-N, gcc-N and g++-N from the
          runner's Ubuntu archive (noble: 9-14); a major the archive does not
          carry fails before compiling. A handful of variants compile .cpp
          files (fire/cfim/cfim.cpp), so g++ comes from the same family.
        required: false
        type: string
        default: "14"
      meson_version:
        description: >-
          Exact Meson version to install via pip, pinned to keep
          configure-time behavior stable across releases. meson.build
          requires >=1.8.0: base/main.f90 uses the FVSVERSION module, and
          only 1.8.0+ adds a link_whole target's private directory to the
          Fortran module search path.
        required: false
        type: string
        default: "1.12.0"
      profile:
        description: >-
          Build profile. One of: reference, debug. reference is
          goldens-aligned; debug enables extra runtime checks and is not
          goldens-compatible.
        required: false
        type: string
        default: "reference"
      python_version:
        description: >-
          Version string for actions/setup-python (Meson, parse_sourcelist,
          and collect-bundle when setup-python runs).
        required: false
        type: string
        default: "3.12"
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact uploaded by this workflow. Exactly
          `fvs-native-linux-<arch>-<run_id>`, where <arch> is the runner's
          `uname -m` (x86_64 or aarch64). The container workflow consumes
          this name to download and unpack the bundle.
        value: ${{ jobs.collect-and-finalize.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Preflight: parse the comma-separated variants input into a JSON array
  # the build matrix can consume. Done once so every matrix leg sees the
  # same expanded list; also surfaces empty-input errors before any compile
  # work runs. Logic lives in tools/ci/expand_variants_matrix.py (shared with
  # Windows and macOS native workflows).
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (expand variant matrix)
    runs-on: ${{ inputs.runner_image }}
    outputs:
      matrix_variants: ${{ steps.matrix.outputs.matrix_variants }}
    steps:
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Expand variants input into matrix JSON
        id: matrix
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: |
          set -euo pipefail
          python3 tools/ci/expand_variants_matrix.py

  # ---------------------------------------------------------------------------
  # Per-variant build: one matrix leg per requested variant. Each leg checks
  # out fvs-build (this repo, at the same ref the workflow is invoked from)
  # plus the caller's source tree, installs the gcc_major toolchain, runs
  # Meson + Ninja, smoke-tests the produced executable, and uploads an
  # ephemeral per-variant artifact for the collect job.
  # ---------------------------------------------------------------------------
  build-variant:
    name: Build FVS${{ matrix.variant }}
    runs-on: ${{ inputs.runner_image }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.preflight.outputs.matrix_variants) }}
    steps:
      # Reusable-workflow jobs do not populate the workspace by default; local
      # composite actions need .github/actions/* on disk before uses: ./...
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Recursive FVS checkout and provenance SHAs.
      - id: prepare
        uses: ./.github/actions/prepare-fvs-native-checkout
        with:
          source_repo: ${{ inputs.source_repo }}
          source_ref: ${{ inputs.source_ref }}

      - name: Install Fortran/C/C++ toolchain (gcc_major)
        id: toolchain
        env:
          V: ${{ inputs.gcc_major }}
        run: |
          set -euo pipefail
          sudo apt-get update
          if ! apt-cache policy "gfortran-${V}" | grep -q 'Candidate: [0-9]'; then
            echo "ERROR: gcc_major=${V}: gfortran-${V} is not available from this runner's Ubuntu archive" >&2
            exit 1
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            "gfortran-${V}" "g++-${V}" ninja-build
          # Use the -N binaries so Meson picks the matching gcc/g++/gfortran
          # trio rather than whatever update-alternatives points at.
          {
            echo "FC=gfortran-${V}"
            echo "CC=gcc-${V}"
            echo "CXX=g++-${V}"
          } >> "$GITHUB_ENV"
          # Cache keys cannot contain commas; keep the version line's identity.
          echo "fc_id=$("gfortran-${V}" --version | head -n 1 | tr -c 'A-Za-z0-9.\n-' '_')" >> "$GITHUB_OUTPUT"

      - name: Set up Python for Meson and parse_sourcelist.py
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pinned Meson
        env:
          MESON_VERSION: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "meson==${MESON_VERSION}"
          meson --version
          ninja --version

      # Cache is a light-touch optimization: tag-driven release builds change
      # source_ref every run and miss; branch/PR builds against the same ref
      # can hit and skip the long Fortran compile. The compiler is in the key
      # because `meson setup --reconfigure` keeps the cached compiler and
      # Ninja keeps objects whose command lines did not change.
      - name: Cache Meson build directory
        uses: actions/cache@v5
        with:
          path: _build
          key: meson-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ inputs.source_ref }}-${{ inputs.profile }}-${{ steps.toolchain.outputs.fc_id }}-${{ hashFiles('fvs-build/meson.build', 'fvs-build/meson_options.txt', 'fvs-build/tools/parse_sourcelist.py', 'fvs-build/tools/fvs_build_info.py', 'fvs-build/tools/ci/provenance.py', 'fvs-build/tools/ci/meson_configure_native.sh') }}

      - name: Configure Meson
        env:
          VARIANT: ${{ matrix.variant }}
          PROFILE: ${{ inputs.profile }}
          FVS_SOURCE: ${{ github.workspace }}/fvs-source
          BUILD_DIR: _build
          OVERLAY_DIR: fvs-build
        run: bash fvs-build/tools/ci/meson_configure_native.sh

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      # Smoke test: pipe EOF on stdin, expect the binary to start up and
      # reach gfortran's `STOP 20` (raised when FVS hits EOF before reading
      # a keyfile). Run from a temp dir so any fort.<N> spillover does not
      # land next to the build outputs.
      - name: Smoke-test the variant executable
        env:
          VARIANT: ${{ matrix.variant }}
          FVS_SOURCE: ${{ github.workspace }}/fvs-source
        run: |
          set -euo pipefail
          BIN_REL="_build/FVS${VARIANT}"
          test -x "$BIN_REL"
          if ldd "$BIN_REL" | grep -q "FVS${VARIANT}\.so"; then
            echo "ERROR: ${BIN_REL} must not depend on FVS${VARIANT}.so at runtime" >&2
            exit 1
          fi
          SMOKE_DIR=$(mktemp -d)
          cp "$BIN_REL" "$SMOKE_DIR/"
          OUTPUT="$( (cd "$SMOKE_DIR" && "./FVS${VARIANT}" </dev/null 2>&1) || true )"
          # version.f90 present means the -D macros must have landed; "unknown" = they did not.
          if [ -f "${FVS_SOURCE}/base/version.f90" ]; then
            VERSION_OUT="$( (cd "$SMOKE_DIR" && "./FVS${VARIANT}" --version) )"
            echo "FVS${VARIANT} --version: ${VERSION_OUT}"
            case "$VERSION_OUT" in
              ""|unknown*|*-dirty*)
                echo "ERROR: unusable build info for FVS${VARIANT}: ${VERSION_OUT}" >&2
                exit 1
                ;;
            esac
          fi
          rm -rf "$SMOKE_DIR"
          echo "----- smoke output (first 30 lines) -----"
          printf '%s\n' "$OUTPUT" | head -n 30
          echo "----- end smoke output -----"
          printf '%s\n' "$OUTPUT" | grep -q 'STOP 20' || {
            echo "ERROR: smoke test for FVS${VARIANT} did not reach STOP 20" >&2
            exit 1
          }

      - name: Verify artifacts' runtime dependencies (readelf)
        env:
          VARIANT: ${{ matrix.variant }}
          # glibc is backward compatible, so binaries needing at most this
          # version run on that release and every newer one. x86_64: 2.35
          # (Ubuntu 22.04). aarch64: 2.38 (Ubuntu 24.04), because gfortran
          # calls libm's fmod/fmodf for MOD() there, which noble versions
          # GLIBC_2.38; on x86_64 it inlines MOD() instead. Lowering either
          # floor means building against an older glibc, not pinning symbols.
          GLIBC_FLOOR: ${{ runner.arch == 'ARM64' && '2.38' || '2.35' }}
        run: |
          set -euo pipefail
          # Linux intentionally dynamic-links libgfortran.so.5 by SONAME (see
          # meson.build: no -static-libgfortran on linux); the loader resolves
          # it from the runtime container's glibc/gfortran baseline. Unlike
          # macOS Mach-O, ELF DT_NEEDED records sonames -- never the build
          # machine's absolute path -- so that failure class cannot occur here.
          # Guard instead against a build-tree or toolchain search path leaking
          # into DT_RPATH/DT_RUNPATH, a NEEDED library the runtime images do
          # not install, and a glibc symbol newer than GLIBC_FLOOR.
          # aarch64 shared libraries record the glibc loader as NEEDED.
          allowed='^(libc\.so\.6|libm\.so\.6|libgfortran\.so\.5|libgcc_s\.so\.1|ld-linux-aarch64\.so\.1)$'
          status=0
          for f in "_build/FVS${VARIANT}" "_build/FVS${VARIANT}.so"; do
            test -f "$f"
            echo "----- readelf -d $f -----"
            readelf -d "$f" | grep -E 'NEEDED|RPATH|RUNPATH' || true
            if readelf -d "$f" | grep -qE '\((RPATH|RUNPATH)\)'; then
              echo "ERROR: $f has a baked-in RPATH/RUNPATH" >&2
              readelf -d "$f" | grep -E '\((RPATH|RUNPATH)\)' >&2
              status=1
            fi
            extra="$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | grep -Ev "$allowed" || true)"
            if [ -n "$extra" ]; then
              echo "ERROR: $f needs libraries outside the allowlist: ${extra//$'\n'/ }" >&2
              status=1
            fi
            glibc_max="$(objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
            echo "highest GLIBC_ symbol version: ${glibc_max}"
            if [ "$(printf '%s\n%s\n' "$glibc_max" "$GLIBC_FLOOR" | sort -V | tail -n 1)" != "$GLIBC_FLOOR" ]; then
              echo "ERROR: $f needs GLIBC_${glibc_max}, newer than the GLIBC_${GLIBC_FLOOR} floor" >&2
              status=1
            fi
          done
          exit $status

      - name: Verify single GCC major in artifacts
        env:
          GCC_MAJOR: ${{ inputs.gcc_major }}
          VARIANT: ${{ matrix.variant }}
        run: bash fvs-build/tools/ci/check_gcc_major.sh "_build/FVS${VARIANT}" "_build/FVS${VARIANT}.so"

      - name: Stage artifacts and per-variant build-info
        env:
          FVS_NATIVE_PLATFORM: linux
          BUILD_PROFILE: ${{ inputs.profile }}
          MESON_BUILDTYPE: plain
          VARIANT: ${{ matrix.variant }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          FVS_BUILD_REPO: ${{ steps.prepare.outputs.overlay_repo }}
          FVS_BUILD_REF: ${{ steps.prepare.outputs.overlay_ref }}
          FVS_BUILD_SHA: ${{ steps.prepare.outputs.fvs_build_sha }}
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          GCC_MAJOR: ${{ inputs.gcc_major }}
          GFORTRAN_PKG: gfortran-${{ inputs.gcc_major }}
          GPP_PKG: g++-${{ inputs.gcc_major }}
          MESON_PIN: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          python3 fvs-build/tools/ci/stage_variant_native.py

      - name: Resolve machine arch
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Upload variant artifact
        uses: actions/upload-artifact@v7
        with:
          # OS- and arch-prefixed name avoids collision when several reusable
          # native workflows run in the same workflow run (e.g.
          # ci-test-reusable-native, or x86_64 + aarch64 for a multi-arch image).
          name: linux-${{ steps.arch.outputs.arch }}-variant-${{ matrix.variant }}
          path: staging/${{ matrix.variant }}/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect-and-finalize: download every per-variant artifact, fan it into
  # the canonical bundle layout, generate an SBOM, and upload the single final
  # artifact that callers (and the container workflow) consume.
  # ---------------------------------------------------------------------------
  collect-and-finalize:
    name: Collect, SBOM, and finalize
    runs-on: ${{ inputs.runner_image }}
    needs: build-variant
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      # Local composite actions require the workflow repo on disk before GitHub
      # can resolve uses: ./.github/actions/... (the composite's own checkout
      # runs too late).
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve machine arch
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - id: collect
        uses: ./.github/actions/collect-native-bundle
        with:
          fvs_native_platform: linux
          download_pattern: linux-${{ steps.arch.outputs.arch }}-variant-*
          artifact_name: fvs-native-linux-${{ steps.arch.outputs.arch }}-${{ github.run_id }}
          sbom_spdx_relpath: sbom/fvs-native-linux.spdx.json
          variants_input: ${{ inputs.variants }}
          runner_image: ${{ inputs.runner_image }}
          meson_version: ${{ inputs.meson_version }}
          python_version: ${{ inputs.python_version }}
