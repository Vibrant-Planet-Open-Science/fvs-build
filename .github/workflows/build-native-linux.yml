# Reusable workflow: build native Linux FVS artifacts via the fvs-build
# Meson overlay. Runs on x86_64 or aarch64: the runner_image picks the arch
# (ubuntu-24.04 or ubuntu-24.04-arm). A caller wanting both calls it twice.
# Builds run inside quay.io/pypa/manylinux_2_28_<arch> (gcc-toolset-14), so
# binaries need at most GLIBC_2.28 and can be repaired into manylinux wheels.
#
# This workflow is source-agnostic. Callers supply a source repo URL and
# ref; this workflow produces a single artifact bundle (per-variant
# binaries + shared libraries + provenance manifest + SBOM) that downstream
# callers consume.
#
# Container packaging is intentionally out of scope for this workflow;
# this workflow's artifacts may be consumed by a separate container workflow
# via its `artifact_name` output.

name: Build native Linux FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Defaults to the 22
          cleanly-buildable US variants. The Canadian variants (bc, on)
          are excluded by default due to incomplete upstream source lists.
        required: false
        type: string
        default: "ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws"
      runner_image:
        description: >-
          GitHub-hosted runner image label. ubuntu-24.04 builds x86_64;
          ubuntu-24.04-arm builds aarch64. The build itself runs in the
          matching manylinux_2_28 container, chosen from the label: one
          containing "arm" gets the aarch64 image.
        required: false
        type: string
        default: "ubuntu-24.04"
      gcc_major:
        description: >-
          GCC major version. Must match the manylinux_2_28 image's
          gcc-toolset (14); any other major fails before compiling.
        required: false
        type: string
        default: "14"
      meson_version:
        description: >-
          Exact Meson version to install via pip, pinned to keep
          configure-time behavior stable across releases. meson.build
          requires >=1.8.0: base/main.f90 uses the FVSVERSION module, and
          only 1.8.0+ adds a link_whole target's private directory to the
          Fortran module search path.
        required: false
        type: string
        default: "1.12.0"
      profile:
        description: >-
          Build profile. One of: reference, debug. reference is
          goldens-aligned; debug enables extra runtime checks and is not
          goldens-compatible.
        required: false
        type: string
        default: "reference"
      python_version:
        description: >-
          Python version for Meson and the build scripts: the image's
          /opt/python/cpXY build in the build jobs, actions/setup-python in
          the collect job.
        required: false
        type: string
        default: "3.12"
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact uploaded by this workflow. Exactly
          `fvs-native-linux-<arch>-<run_id>`, where <arch> is the runner's
          `uname -m` (x86_64 or aarch64). The container workflow consumes
          this name to download and unpack the bundle.
        value: ${{ jobs.collect-and-finalize.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build: one job configures every requested variant in a single Meson build
  # directory (so the common archives compile once), runs Meson + Ninja inside
  # the manylinux container, checks and stages each variant, and uploads one
  # ephemeral staging artifact for the collect job. container.image cannot
  # read the runner's arch, so the image follows the runner label: one
  # containing "arm" gets the aarch64 image.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ inputs.runner_image }})
    runs-on: ${{ inputs.runner_image }}
    container:
      image: quay.io/pypa/manylinux_2_28_${{ contains(inputs.runner_image, 'arm') && 'aarch64' || 'x86_64' }}
    steps:
      # Local actions (uses: ./.github/actions/...) and tools/ need this repo on
      # disk. In a called workflow github.* and a bare checkout are the caller's
      # repo; job.workflow_* is this workflow's own repo and commit.
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1

      # Later steps loop over $VARIANTS.
      - name: Resolve variant list
        id: variants
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: bash tools/ci/resolve_variants.sh

      # Recursive FVS checkout and provenance SHAs.
      - id: prepare
        uses: ./.github/actions/prepare-fvs-native-checkout
        with:
          source_repo: ${{ inputs.source_repo }}
          source_ref: ${{ inputs.source_ref }}

      - name: Select toolchain and Python from the manylinux image
        id: toolchain
        env:
          V: ${{ inputs.gcc_major }}
          PYV: ${{ inputs.python_version }}
          MESON_VERSION: ${{ inputs.meson_version }}
        run: |
          set -euo pipefail
          have="$(gfortran -dumpversion)"
          if [ "${have%%.*}" != "$V" ]; then
            echo "ERROR: gcc_major=${V}, but this manylinux image provides GCC ${have}" >&2
            exit 1
          fi
          py="/opt/python/cp${PYV/./}-cp${PYV/./}/bin"
          test -x "$py/python3" || { echo "ERROR: no Python ${PYV} in the image" >&2; exit 1; }
          echo "$py" >> "$GITHUB_PATH"
          {
            echo "FC=gfortran"
            echo "CC=gcc"
            echo "CXX=g++"
          } >> "$GITHUB_ENV"
          "$py/python3" -m pip install "meson==${MESON_VERSION}" ninja
          # Cache keys cannot contain commas; keep the version line's identity.
          echo "fc_id=$(gfortran --version | head -n 1 | tr -c 'A-Za-z0-9.\n-' '_')" >> "$GITHUB_OUTPUT"

      # Ninja rebuilds any object older than its sources, and a fresh checkout
      # stamps every file with the current time, so a restored _build would be
      # rebuilt in full. Pin source timestamps to a fixed past date instead.
      # Safe because the cache key holds the source SHA (a hit means identical
      # sources) and the build-relevant overlay files; changed compile flags
      # still rebuild through Ninja's command-line tracking.
      - name: Pin source timestamps for the build cache
        run: find fvs-source fvs-build -name .git -prune -o -type f -exec touch -t 200001010000 {} +

      # Cache is a light-touch optimization: a new source commit misses, so
      # release builds compile from scratch; repeat PR runs against the same
      # source commit hit and skip the long Fortran compile. The compiler is in
      # the key because `meson setup --reconfigure` keeps the cached compiler
      # and Ninja keeps objects whose command lines did not change.
      - name: Cache Meson build directory
        uses: actions/cache@v6
        with:
          path: _build
          key: meson-${{ runner.os }}-${{ runner.arch }}-${{ steps.variants.outputs.id }}-${{ steps.prepare.outputs.source_sha }}-${{ inputs.profile }}-${{ steps.toolchain.outputs.fc_id }}-${{ hashFiles('fvs-build/meson.build', 'fvs-build/meson_options.txt', 'fvs-build/tools/parse_sourcelist.py', 'fvs-build/tools/fvs_build_info.py', 'fvs-build/tools/ci/provenance.py', 'fvs-build/tools/ci/meson_configure_native.sh') }}

      - name: Configure Meson
        env:
          PROFILE: ${{ inputs.profile }}
          BUILD_DIR: _build
          OVERLAY_DIR: fvs-build
        # $GITHUB_WORKSPACE, not ${{ github.workspace }}: the expression is the
        # host path, which does not exist inside the manylinux container.
        run: FVS_SOURCE="$GITHUB_WORKSPACE/fvs-source" bash fvs-build/tools/ci/meson_configure_native.sh

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      - name: Smoke-test the variant executables
        run: bash fvs-build/tools/ci/smoke_test_native.sh

      - name: Verify artifacts' runtime dependencies (readelf)
        env:
          # glibc is backward compatible, so binaries needing at most this
          # version run on that release and every newer one: the
          # manylinux_2_28 build environment's glibc.
          GLIBC_FLOOR: "2.28"
        run: |
          set -euo pipefail
          # The shared library dynamic-links libgfortran.so.5 by SONAME (see
          # meson.build: libgfortran.a is not PIC); the executable links the
          # GCC runtime statically and needs only glibc. Unlike
          # macOS Mach-O, ELF DT_NEEDED records sonames -- never the build
          # machine's absolute path -- so that failure class cannot occur here.
          # Guard instead against a build-tree or toolchain search path leaking
          # into DT_RPATH/DT_RUNPATH, a NEEDED library the runtime images do
          # not install, and a glibc symbol newer than GLIBC_FLOOR.
          # aarch64 shared libraries record the glibc loader as NEEDED.
          glibc='libc\.so\.6|libm\.so\.6|ld-linux-aarch64\.so\.1'
          status=0
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v" "_build/FVS$v.so"); done
          for f in "${files[@]}"; do
            test -f "$f"
            case "$f" in
              *.so) allowed="^(${glibc}|libgfortran\.so\.5|libgcc_s\.so\.1)$" ;;
              *) allowed="^(${glibc})$" ;;
            esac
            echo "----- readelf -d $f -----"
            readelf -d "$f" | grep -E 'NEEDED|RPATH|RUNPATH' || true
            if readelf -d "$f" | grep -qE '\((RPATH|RUNPATH)\)'; then
              echo "ERROR: $f has a baked-in RPATH/RUNPATH" >&2
              readelf -d "$f" | grep -E '\((RPATH|RUNPATH)\)' >&2
              status=1
            fi
            extra="$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | grep -Ev "$allowed" || true)"
            if [ -n "$extra" ]; then
              echo "ERROR: $f needs libraries outside the allowlist: ${extra//$'\n'/ }" >&2
              status=1
            fi
            glibc_max="$(objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
            echo "highest GLIBC_ symbol version: ${glibc_max}"
            if [ "$(printf '%s\n%s\n' "$glibc_max" "$GLIBC_FLOOR" | sort -V | tail -n 1)" != "$GLIBC_FLOOR" ]; then
              echo "ERROR: $f needs GLIBC_${glibc_max}, newer than the GLIBC_${GLIBC_FLOOR} floor" >&2
              status=1
            fi
          done
          exit $status

      - name: Verify single GCC major in artifacts
        env:
          GCC_MAJOR: ${{ inputs.gcc_major }}
        run: |
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v" "_build/FVS$v.so"); done
          bash fvs-build/tools/ci/check_gcc_major.sh "${files[@]}"

      - name: Stage artifacts and per-variant build-info
        env:
          FVS_NATIVE_PLATFORM: linux
          BUILD_PROFILE: ${{ inputs.profile }}
          MESON_BUILDTYPE: plain
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          FVS_BUILD_REPO: ${{ steps.prepare.outputs.overlay_repo }}
          FVS_BUILD_REF: ${{ steps.prepare.outputs.overlay_ref }}
          FVS_BUILD_SHA: ${{ steps.prepare.outputs.fvs_build_sha }}
          RUNNER_IMAGE: ${{ inputs.runner_image }} / quay.io/pypa/manylinux_2_28_${{ contains(inputs.runner_image, 'arm') && 'aarch64' || 'x86_64' }}
          GCC_MAJOR: ${{ inputs.gcc_major }}
          GFORTRAN_PKG: gcc-toolset-${{ inputs.gcc_major }}-gcc-gfortran
          GPP_PKG: gcc-toolset-${{ inputs.gcc_major }}-gcc-c++
          MESON_PIN: ${{ inputs.meson_version }}
        run: python3 fvs-build/tools/ci/stage_variant_native.py

      - name: Resolve machine arch
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Upload staging artifact
        uses: actions/upload-artifact@v7
        with:
          # OS- and arch-prefixed name avoids collision when several reusable
          # native workflows run in the same workflow run (e.g.
          # ci-test-reusable-native, or x86_64 + aarch64 for a multi-arch image).
          name: linux-${{ steps.arch.outputs.arch }}-staging
          path: staging/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect-and-finalize: download the staging artifact, fan it into the
  # canonical bundle layout, generate an SBOM, and upload the single final
  # artifact that callers (and the container workflow) consume.
  # ---------------------------------------------------------------------------
  collect-and-finalize:
    name: Collect, SBOM, and finalize
    runs-on: ${{ inputs.runner_image }}
    needs: build
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      # Local actions (uses: ./.github/actions/...) and tools/ need this repo on
      # disk. In a called workflow github.* and a bare checkout are the caller's
      # repo; job.workflow_* is this workflow's own repo and commit.
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1

      - name: Resolve machine arch
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - id: collect
        uses: ./.github/actions/collect-native-bundle
        with:
          fvs_native_platform: linux
          staging_artifact: linux-${{ steps.arch.outputs.arch }}-staging
          artifact_name: fvs-native-linux-${{ steps.arch.outputs.arch }}-${{ github.run_id }}
          sbom_spdx_relpath: sbom/fvs-native-linux.spdx.json
          variants_input: ${{ inputs.variants }}
          runner_image: ${{ inputs.runner_image }}
          meson_version: ${{ inputs.meson_version }}
          python_version: ${{ inputs.python_version }}
