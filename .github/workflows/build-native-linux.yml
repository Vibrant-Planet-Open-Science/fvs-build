# Reusable workflow: native Linux FVS bundle, built in the manylinux_2_28
# container for the runner's arch. Interface: docs/workflow-interface.md.

name: Build native Linux FVS artifacts (reusable)

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source repo containing FVS code, in owner/name form.
        required: true
        type: string
      source_ref:
        description: "Tag, branch, or SHA in source_repo to build from."
        required: true
        type: string
      variants:
        description: >-
          Comma-separated list of FVS variant codes. Defaults to empty, which
          builds all US variants. The Canadian variants (bc, on) are excluded
          by default due to incomplete upstream source lists.
        required: false
        type: string
        default: ""
      arch:
        description: >-
          x86_64 (ubuntu-24.04) or aarch64 (ubuntu-24.04-arm). The build runs
          in the matching manylinux_2_28 container.
        required: false
        type: string
        default: "x86_64"
      profile:
        description: >-
          Build profile. One of: reference, debug. reference is
          goldens-aligned; debug enables extra runtime checks and is not
          goldens-compatible.
        required: false
        type: string
        default: "reference"
    outputs:
      artifact_name:
        description: >-
          Name of the bundled artifact uploaded by this workflow. Exactly
          `fvs-native-linux-<arch>-<run_id>`. The container workflows consume
          this name to download and unpack the bundle.
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  # One Meson build directory for all variants, so the common archives
  # compile once.
  build:
    name: Build (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: quay.io/pypa/manylinux_2_28_${{ inputs.arch }}
    outputs:
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
    env:
      # The manylinux_2_28 gcc-toolset; a newer image fails the check below
      # rather than silently changing compilers.
      GCC_MAJOR: "14"
    steps:
      # In a called workflow github.* and a bare checkout are the caller's repo;
      # job.workflow_* is this repo, which tools/ needs.
      - name: Check out fvs-build (workflow repository)
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: fvs-build

      # fetch-depth: 0 because meson.build derives build-info macros from git in
      # this tree, and `git describe --tags` needs tags and history.
      - name: Check out FVS source tree
        id: source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: fvs-source
          submodules: recursive
          fetch-depth: 0

      # Later steps loop over $VARIANTS.
      - name: Resolve variant list
        id: variants
        env:
          VARIANTS_CSV: ${{ inputs.variants }}
        run: bash fvs-build/tools/ci/resolve_variants.sh

      - name: Select toolchain and Python from the manylinux image
        id: toolchain
        run: |
          set -euo pipefail
          have="$(gfortran -dumpversion)"
          if [ "${have%%.*}" != "$GCC_MAJOR" ]; then
            echo "ERROR: expected GCC ${GCC_MAJOR}, but this manylinux image provides GCC ${have}" >&2
            exit 1
          fi
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
          {
            echo "FC=gfortran"
            echo "CC=gcc"
            echo "CXX=g++"
            echo "GFORTRAN_PKG=gcc-toolset-${GCC_MAJOR}-gcc-gfortran"
            echo "GPP_PKG=gcc-toolset-${GCC_MAJOR}-gcc-c++"
          } >> "$GITHUB_ENV"
          # Cache keys cannot contain commas; keep the version line's identity.
          echo "fc_id=$(gfortran --version | head -n 1 | tr -c 'A-Za-z0-9.\n-' '_')" >> "$GITHUB_OUTPUT"

      - name: Install pinned Meson and Ninja
        run: python3 -m pip install -r fvs-build/tools/ci/requirements-build.txt ninja

      # A fresh checkout stamps files with the current time, so Ninja would
      # rebuild a restored _build in full. Safe because the cache key holds the
      # source SHA and overlay files; flag changes still rebuild via Ninja.
      - name: Pin source timestamps for the build cache
        run: find fvs-source fvs-build -name .git -prune -o -type f -exec touch -t 200001010000 {} +

      # The compiler is in the key because `meson setup --reconfigure` keeps
      # the cached compiler and Ninja keeps objects whose command lines did
      # not change.
      - name: Cache Meson build directory
        uses: actions/cache@v6
        with:
          path: _build
          key: >-
            meson-linux-${{ inputs.arch }}-${{ steps.variants.outputs.id }}-${{ steps.source.outputs.commit }}-${{
              inputs.profile }}-${{ steps.toolchain.outputs.fc_id }}-${{
              hashFiles(
                'fvs-build/meson.build',
                'fvs-build/meson_options.txt',
                'fvs-build/tools/parse_sourcelist.py',
                'fvs-build/tools/fvs_build_info.py',
                'fvs-build/tools/ci/meson_configure_native.sh',
                'fvs-build/tools/ci/requirements-build.txt'
              )
            }}

      - name: Configure Meson
        env:
          PROFILE: ${{ inputs.profile }}
          BUILD_DIR: _build
          OVERLAY_DIR: fvs-build
        # $GITHUB_WORKSPACE, not ${{ github.workspace }}: the expression is the
        # host path, which does not exist inside the manylinux container.
        run: FVS_SOURCE="$GITHUB_WORKSPACE/fvs-source" bash fvs-build/tools/ci/meson_configure_native.sh

      - name: Compile (Ninja)
        run: ninja -C _build -k 0

      - name: Smoke-test the variant executables
        run: bash fvs-build/tools/ci/smoke_test_native.sh

      - name: Verify artifacts' runtime dependencies (readelf)
        env:
          GLIBC_FLOOR: "2.28"
        run: |
          set -euo pipefail
          # The .so links libgfortran.so.5 dynamically (libgfortran.a is not
          # PIC). ELF NEEDED records sonames, never absolute paths, so unlike
          # macOS the leak to guard against is an RPATH/RUNPATH.
          # aarch64 shared libraries record the glibc loader as NEEDED.
          glibc='libc\.so\.6|libm\.so\.6|ld-linux-aarch64\.so\.1'
          status=0
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v" "_build/FVS$v.so"); done
          for f in "${files[@]}"; do
            test -f "$f"
            case "$f" in
              *.so) allowed="^(${glibc}|libgfortran\.so\.5|libgcc_s\.so\.1)$" ;;
              *) allowed="^(${glibc})$" ;;
            esac
            echo "----- readelf -d $f -----"
            readelf -d "$f" | grep -E 'NEEDED|RPATH|RUNPATH' || true
            if readelf -d "$f" | grep -qE '\((RPATH|RUNPATH)\)'; then
              echo "ERROR: $f has a baked-in RPATH/RUNPATH" >&2
              readelf -d "$f" | grep -E '\((RPATH|RUNPATH)\)' >&2
              status=1
            fi
            extra="$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | grep -Ev "$allowed" || true)"
            if [ -n "$extra" ]; then
              echo "ERROR: $f needs libraries outside the allowlist: ${extra//$'\n'/ }" >&2
              status=1
            fi
            glibc_max="$(objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
            echo "highest GLIBC_ symbol version: ${glibc_max}"
            if [ "$(printf '%s\n%s\n' "$glibc_max" "$GLIBC_FLOOR" | sort -V | tail -n 1)" != "$GLIBC_FLOOR" ]; then
              echo "ERROR: $f needs GLIBC_${glibc_max}, newer than the GLIBC_${GLIBC_FLOOR} floor" >&2
              status=1
            fi
          done
          exit $status

      - name: Verify single GCC major in artifacts
        run: |
          files=()
          for v in $VARIANTS; do files+=("_build/FVS$v" "_build/FVS$v.so"); done
          bash fvs-build/tools/ci/check_gcc_major.sh "${files[@]}"

      - name: Bundle binaries, provenance and SBOM
        id: bundle
        env:
          VARIANTS_INPUT: ${{ inputs.variants }}
          BUILD_PROFILE: ${{ inputs.profile }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
          FVS_BUILD_REPO: ${{ job.workflow_repository }}
          FVS_BUILD_REF: ${{ job.workflow_ref }}
          FVS_BUILD_SHA: ${{ job.workflow_sha }}
          RUNNER_IMAGE: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }} / quay.io/pypa/manylinux_2_28_${{ inputs.arch }}
        run: python3 fvs-build/tools/ci/provenance.py bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.artifact_name }}/
          retention-days: 30
          if-no-files-found: error
