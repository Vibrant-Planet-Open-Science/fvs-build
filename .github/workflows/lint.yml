# Authoritative lint gate.
#
# Runs `pre-commit run --all-files`, which executes every hook declared
# in .pre-commit-config.yaml against every tracked file. Local
# `pre-commit install` is advisory; this workflow is what blocks merges
# when a check fails.
#
# Hook environments (actionlint, yamllint, hadolint-docker, etc.) are
# cached via actions/cache keyed on the Python interpreter path and the
# config's pinned `rev:` values, so steady-state runs are fast.

name: lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ steps.setup-python.outputs.python-path }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files
