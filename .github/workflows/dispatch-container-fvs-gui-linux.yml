name: Dispatch native + FVS GUI container build (manual)

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "FVS source repo (owner/name)"
        required: true
        default: "USDAForestService/ForestVegetationSimulator"
        type: string
      source_ref:
        description: "FVS source ref (tag, branch, or SHA)"
        required: true
        default: "2027.1.0"
        type: string
      variants:
        description: "Comma-separated FVS variant codes (empty: the 22 US variants)"
        required: false
        default: ""
        type: string
      interface_repo:
        description: "Interface repo providing rFVS + fvsOL (owner/name); override for a fork"
        required: false
        default: "USDAForestService/ForestVegetationSimulator-Interface"
        type: string
      interface_ref:
        description: >-
          Interface source ref (tag, branch, or SHA); release 20261019 or
          later (earlier refs ship rFVS/fvsOL without NAMESPACE).
        required: true
        default: "20261109"
        type: string
      image_name:
        description: "Fully-qualified image name without tag (defaults to usfs-fvs-gui namespace)"
        required: false
        default: ""
        type: string
      image_tag:
        description: "Primary image tag (typically the FVS source_ref)"
        required: true
        default: "2027.1.0"
        type: string
      image_extra_tags:
        description: "Comma-separated extra tags (e.g. latest)"
        required: false
        default: ""
        type: string
      push:
        description: "Push to GHCR after the container image build succeeds"
        required: false
        default: false
        type: boolean
      arm64:
        description: "Also build linux/arm64 (native aarch64 bundle + multi-arch image)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  # Input defaults cannot reference github.repository_owner, so derive it here.
  resolve-image-name:
    name: Resolve image_name default
    runs-on: ubuntu-24.04
    outputs:
      image_name: ${{ steps.resolve.outputs.image_name }}
    steps:
      - name: Pick image_name
        id: resolve
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_NAME}" ]; then
            IMAGE_NAME="${INPUT_IMAGE_NAME}"
          else
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="ghcr.io/${OWNER_LC}/usfs-fvs-gui"
          fi
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_name resolved to: ${IMAGE_NAME}"

  native:
    name: Native binary build
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: ${{ inputs.source_repo }}
      source_ref: ${{ inputs.source_ref }}
      variants: ${{ inputs.variants }}

  native-arm64:
    name: Native binary build (arm64)
    if: inputs.arm64
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: ${{ inputs.source_repo }}
      source_ref: ${{ inputs.source_ref }}
      variants: ${{ inputs.variants }}
      arch: aarch64

  fvs-gui-container:
    name: FVS GUI container build
    needs: [resolve-image-name, native, native-arm64]
    # Run when native-arm64 was skipped (arm64: false), not only on success.
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/build-container-fvs-gui-linux.yml
    with:
      arm64: ${{ inputs.arm64 }}
      interface_repo: ${{ inputs.interface_repo }}
      interface_ref: ${{ inputs.interface_ref }}
      image_name: ${{ needs.resolve-image-name.outputs.image_name }}
      image_tag: ${{ inputs.image_tag }}
      image_extra_tags: ${{ inputs.image_extra_tags }}
      push: ${{ inputs.push }}
    secrets: inherit
