# Local-dev driver for the reusable native Linux workflow.
#
# This is a thin workflow_dispatch wrapper around build-native-linux.yml so
# the reusable workflow can be exercised manually from the Actions UI (or
# `gh workflow run`) before any external caller (fvs-engine release
# pipeline, fvs-build's own upstream tracker, etc.) exists. Defaults match
# the upstream tag docker_fvs last shipped, so a no-input dispatch reproduces
# the docker_fvs-equivalent build under the new architecture.
#
# This workflow is NOT the caller interface; it is for local validation
# only. Real callers invoke .github/workflows/build-native-linux.yml directly
# via `uses: <owner>/fvs-build/.github/workflows/build-native-linux.yml@<ref>`.

name: Dispatch native Linux build (manual)

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo (owner/name)"
        required: true
        default: "USDAForestService/ForestVegetationSimulator"
        type: string
      source_ref:
        description: "Source ref (tag, branch, or SHA)"
        required: true
        default: "FS2025.4c"
        type: string
      variants:
        description: "Comma-separated FVS variant codes (default: 22 known-good US variants)"
        required: false
        default: "ak,bm,ca,ci,cr,cs,ec,em,ie,kt,ls,nc,ne,oc,op,pn,sn,so,tt,ut,wc,ws"
        type: string
      runner_image:
        description: "GitHub-hosted runner image label"
        required: false
        default: "ubuntu-24.04"
        type: string
      gfortran_package:
        description: "apt package providing gfortran"
        required: false
        default: "gfortran-13"
        type: string
      gpp_package:
        description: "apt package providing g++ (matched to gfortran family)"
        required: false
        default: "g++-13"
        type: string
      meson_version:
        description: "Meson version installed via pip"
        required: false
        default: "1.5.2"
        type: string
      extra_fortran_args:
        description: "Comma-separated extra Fortran compile flags (escape hatch; leave empty for production)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (via reusable workflow)
    uses: ./.github/workflows/build-native-linux.yml
    with:
      source_repo: ${{ inputs.source_repo }}
      source_ref: ${{ inputs.source_ref }}
      variants: ${{ inputs.variants }}
      runner_image: ${{ inputs.runner_image }}
      gfortran_package: ${{ inputs.gfortran_package }}
      gpp_package: ${{ inputs.gpp_package }}
      meson_version: ${{ inputs.meson_version }}
      extra_fortran_args: ${{ inputs.extra_fortran_args }}
    # secrets: inherit  # uncomment if source_repo becomes private and the
    #                   # workflow needs to authenticate the source checkout
