# Keeps GitHub Actions current in the workflows and the composite actions
# (.github/actions/* is not scanned from "/"). Commits are `build(deps): …`,
# a visible release-please type, so updates feed the next release.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # One PR per run for every action and directory, majors included:
      # with "require branches to be up to date", separate PRs each need a
      # rebase and a full CI run before the next can merge.
      actions:
        patterns:
          - "*"
