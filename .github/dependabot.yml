# .github/actions/* is not scanned from "/". `build` is a visible
# release-please type, so updates feed the next release.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # One PR for everything, majors included: with "require branches to be up
      # to date", separate PRs each need a rebase and full CI run to merge.
      actions:
        patterns:
          - "*"
