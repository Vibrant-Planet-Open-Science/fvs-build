# Vendored rather than published: it is only installed into the workspace image's venv.
# The entry point NAME is the URL segment: `fvs-gui` here is the `/fvs-gui/` route
# the launcher tile and `?urlpath=fvs-gui/` links open. Nothing else encodes it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupyter-fvsol-proxy"
version = "1.0.0"
description = "jupyter-server-proxy registration for the FVSOnLocal (fvsOL) R-Shiny GUI"
requires-python = ">=3.10"
# 4.1 is the floor for entry-point discovery.
dependencies = ["jupyter-server-proxy>=4.1"]

[project.entry-points."jupyter_serverproxy_servers"]
fvs-gui = "jupyter_fvsol_proxy:setup_fvs_gui"

[tool.hatch.build.targets.wheel]
packages = ["jupyter_fvsol_proxy"]
