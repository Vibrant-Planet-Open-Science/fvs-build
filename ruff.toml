# Ruff configuration (https://docs.astral.sh/ruff/).
#
# Single line length for code, docstrings, and comments: 88 columns
# (common Black / Ruff default). `ruff format` and E501 share this limit.

target-version = "py310"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors (includes E501)
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle (Google convention below)
    "RUF", # Ruff-specific rules
]

[lint.pydocstyle]
convention = "google"
